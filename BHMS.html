<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BHMS — Boarding House Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:#0D1117; --navy-mid:#161B22; --navy-light:#21262D;
  --teal:#00E5A0; --teal2:#00C88A; --teal-dim:#003D2B;
  --teal-light:rgba(0,229,160,0.12); --teal-pale:rgba(0,229,160,0.06);
  --white:#FFFFFF; --bg:#0D1117; --bg2:#0F1419; --bg3:#161B22;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --slate:#8B949E; --slate-light:#6E7681; --dark:#F0F6FC;
  --amber:#F0B429; --amber-light:rgba(240,180,41,0.15); --amber-dim:#3D2E00;
  --red:#FF4C6A; --red-light:rgba(255,76,106,0.12); --red-dim:#3D0014;
  --green:#00E5A0; --green-light:rgba(0,229,160,0.12); --green-dim:#003D2B;
  --blue:#58A6FF; --blue-light:rgba(88,166,255,0.12); --blue-dim:#001F3D;
  --purple:#D2A8FF; --purple-light:rgba(210,168,255,0.12); --purple-dim:#2A0057;
  --sidebar-w:230px; --topbar-h:58px;
  --font-head:'Syne',sans-serif; --font-body:'Outfit',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  --glow-teal:0 0 20px rgba(0,229,160,0.3),0 0 60px rgba(0,229,160,0.1);
  --glow-red:0 0 20px rgba(255,76,106,0.3);
  --radius:10px; --radius-lg:14px; --radius-sm:6px;
}
[data-theme="light"]{--navy:#F0F4F8;--navy-mid:#FFFFFF;--navy-light:#E8EEF4;--teal:#008C5E;--teal2:#006E4A;--teal-dim:#C6F0E0;--teal-light:rgba(0,140,94,0.10);--teal-pale:rgba(0,140,94,0.07);--white:#FFFFFF;--bg:#EEF2F7;--bg2:#E5EBF3;--bg3:#DAE2ED;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.15);--slate:#536178;--slate-light:#7A8EA8;--dark:#1A2535;--amber:#A06800;--amber-light:rgba(160,104,0,0.12);--amber-dim:#FFF3D1;--red:#C0002E;--red-light:rgba(192,0,46,0.10);--red-dim:#FFD6E0;--green:#008C5E;--green-light:rgba(0,140,94,0.10);--green-dim:#C6F0E0;--blue:#1558B0;--blue-light:rgba(21,88,176,0.10);--blue-dim:#D6E8FF;--purple:#6B28C8;--purple-light:rgba(107,40,200,0.10);--purple-dim:#EEE0FF;--glow-teal:0 0 16px rgba(0,140,94,0.18),0 0 40px rgba(0,140,94,0.07);--glow-red:0 0 16px rgba(192,0,46,0.18);}
[data-theme="light"] .auth-canvas{filter:invert(1) hue-rotate(170deg) brightness(1.4)}
[data-theme="light"] .page-body::before{background:radial-gradient(ellipse 700px 500px at 80% 10%,rgba(0,140,94,0.04) 0%,transparent 70%),radial-gradient(ellipse 500px 400px at 10% 90%,rgba(21,88,176,0.03) 0%,transparent 70%)}
[data-theme="light"] .form-select option{background:#fff;color:#1A2535}
[data-theme="light"] .toast-success{background:rgba(198,240,224,0.98)}
[data-theme="light"] .toast-error{background:rgba(255,214,224,0.98)}
[data-theme="light"] .toast-warning{background:rgba(255,243,209,0.98)}
[data-theme="light"] .stat-card,[data-theme="light"] .modal,[data-theme="light"] .card{background:var(--navy-mid)}
[data-theme="light"] .modal-overlay{background:rgba(0,0,0,.35)}
[data-theme="light"] .notif-panel{background:var(--navy-mid);border-color:var(--border2);box-shadow:0 12px 40px rgba(0,0,0,.12),0 0 0 1px var(--border2)}
[data-theme="light"] .topbar{box-shadow:0 1px 0 var(--border)}
[data-theme="light"] .toggle.off{background:var(--navy-light)}
[data-theme="light"] .bar{background:rgba(0,140,94,0.2)}
[data-theme="light"] thead th{background:var(--bg)}
[data-theme="light"] tbody tr:hover td{background:var(--navy-light)}
[data-theme="light"] .sidebar::after{background:linear-gradient(to top,rgba(0,140,94,0.04),transparent)}
[data-theme="light"] .filter-tab.active{background:var(--teal-light);color:var(--teal);border-color:rgba(0,140,94,0.35)}
[data-theme="light"] .role-tab{background:var(--navy-light)}
[data-theme="light"] .role-tab.active{background:var(--teal-light);color:var(--teal);border-color:rgba(0,140,94,0.4)}
[data-theme="light"] .settings-nav-item:hover{background:var(--navy-light)}
[data-theme="light"] .notif-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
[data-theme="light"] .topbar-back:hover{background:var(--teal-dim);color:var(--teal)}
[data-theme="light"] .notif-item-title,[data-theme="light"] .notif-panel-title{color:var(--dark)}
[data-theme="light"] [style*="color:#fff"]{color:var(--dark)!important}
[data-theme="light"] [style*="color: #fff"]{color:var(--dark)!important}
[data-theme="light"] [style*="color:rgba(255,255,255"]{color:var(--slate)!important}
[data-theme="light"] button[style*="background:var(--purple)"][style*="color:#fff"]{color:#fff!important}
[data-theme="light"] .nav-badge,[data-theme="light"] .notif-count{color:#fff!important}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--dark);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:var(--font-body);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font-body);outline:none}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,229,160,0.3)}
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--navy-mid);display:flex;flex-direction:column;height:100%;overflow-y:auto;border-right:1px solid var(--border);position:relative;transition:background .25s,border-color .25s}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--dark);letter-spacing:-1px}
.logo-mark span{color:var(--teal);text-shadow:var(--glow-teal)}
.logo-tag{font-size:9px;color:var(--slate);letter-spacing:3px;text-transform:uppercase;margin-top:3px;font-family:var(--font-mono)}
.nav-group-label{font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--slate-light);letter-spacing:2px;text-transform:uppercase;padding:18px 20px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;font-weight:500;color:var(--slate);cursor:pointer;border-left:2px solid transparent;transition:all .18s;position:relative}
.nav-item:hover{color:var(--dark);background:var(--teal-pale)}
.nav-item.active{color:var(--teal);background:var(--teal-pale);border-left-color:var(--teal)}
.nav-item.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:20px;background:transparent}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;opacity:.8}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-family:var(--font-mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:100px;min-width:18px;text-align:center;box-shadow:0 0 10px rgba(255,76,106,0.5)}
.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.user-av{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--bg);flex-shrink:0;border:1px solid rgba(0,229,160,0.3)}
.user-name{font-size:12px;font-weight:600;color:var(--dark);font-family:var(--font-head)}
.user-role{font-size:10px;color:var(--slate);font-family:var(--font-mono);letter-spacing:.5px}
.main-content{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--navy-mid);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:12px;transition:background .25s,border-color .25s}
.topbar-title{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--dark);letter-spacing:-.3px}
.topbar-back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;color:var(--slate);background:var(--navy-light);border:1px solid var(--border);cursor:pointer;transition:all .18s;font-family:var(--font-body);flex-shrink:0}
.topbar-back:hover{background:var(--teal-light);color:var(--teal);border-color:rgba(0,229,160,0.3);transform:translateX(-2px)}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.page-body{flex:1;padding:22px 24px;overflow-y:auto;background:var(--bg);position:relative}
.page-body::before{content:'';position:fixed;top:var(--topbar-h);left:var(--sidebar-w);right:0;bottom:0;background:radial-gradient(ellipse 700px 500px at 80% 10%,rgba(0,229,160,0.03) 0%,transparent 70%),radial-gradient(ellipse 500px 400px at 10% 90%,rgba(88,166,255,0.03) 0%,transparent 70%);pointer-events:none;z-index:0}
.page-body>*{position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:var(--font-body);transition:all .18s;white-space:nowrap;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--teal);color:var(--bg);box-shadow:0 0 0 rgba(0,229,160,0)}
.btn-primary:hover{background:var(--teal2);box-shadow:var(--glow-teal)}
.btn-ghost{background:transparent;color:var(--slate);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--navy-light);color:var(--dark);border-color:var(--border2)}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid rgba(255,76,106,0.25)}
.btn-danger:hover{background:rgba(255,76,106,0.2);box-shadow:var(--glow-red)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-full{width:100%;justify-content:center;padding:11px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:600;font-family:var(--font-mono);letter-spacing:.3px}
.bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-green{background:var(--green-light);color:var(--teal)}.badge-green .bdot{background:var(--teal);box-shadow:0 0 6px rgba(0,229,160,0.6)}
.badge-red{background:var(--red-light);color:var(--red)}.badge-red .bdot{background:var(--red);box-shadow:0 0 6px rgba(255,76,106,0.6)}
.badge-amber{background:var(--amber-light);color:var(--amber)}.badge-amber .bdot{background:var(--amber)}
.badge-blue{background:var(--blue-light);color:var(--blue)}.badge-blue .bdot{background:var(--blue)}
.badge-purple{background:var(--purple-light);color:var(--purple)}.badge-purple .bdot{background:var(--purple)}
.badge-teal{background:var(--teal-light);color:var(--teal)}.badge-teal .bdot{background:var(--teal)}
.badge-slate{background:var(--navy-light);color:var(--slate);border:1px solid var(--border)}
.card{background:var(--navy-mid);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;transition:background .25s,border-color .25s}
.card:hover{border-color:var(--border2)}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:transparent}
.card-title{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--dark);letter-spacing:-.2px}
.card-body{padding:16px 18px}
.stat-card{background:var(--navy-mid);border-radius:var(--radius-lg);border:1px solid var(--border);padding:18px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;border-radius:2px 0 0 2px}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat-card.sc-teal::before{background:var(--teal);box-shadow:0 0 12px rgba(0,229,160,0.6)}
.stat-card.sc-teal:hover{box-shadow:0 8px 32px rgba(0,229,160,0.08)}
.stat-card.sc-amber::before{background:var(--amber)}
.stat-card.sc-red::before{background:var(--red);box-shadow:0 0 12px rgba(255,76,106,0.4)}
.stat-card.sc-green::before{background:var(--teal);box-shadow:0 0 14px rgba(0,229,160,0.5)}
.stat-card.sc-purple::before{background:var(--purple)}
.stat-card.sc-blue::before{background:var(--blue)}
.stat-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;float:right;margin-top:-2px;border:1px solid var(--border)}
.si-teal{background:var(--teal-light);border-color:rgba(0,229,160,0.2)!important}
.si-amber{background:var(--amber-light);border-color:rgba(240,180,41,0.2)!important}
.si-red{background:var(--red-light);border-color:rgba(255,76,106,0.2)!important}
.si-green{background:var(--green-light);border-color:rgba(0,229,160,0.2)!important}
.si-purple{background:var(--purple-light);border-color:rgba(210,168,255,0.2)!important}
.si-blue{background:var(--blue-light);border-color:rgba(88,166,255,0.2)!important}
.stat-label{font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--slate);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--dark);line-height:1;letter-spacing:-1px}
.stat-sub{font-size:11px;color:var(--slate);margin-top:6px}
.stat-trend-up{font-size:11px;color:var(--teal);margin-top:6px;font-family:var(--font-mono)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:1px;padding:11px 16px;background:var(--bg);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{font-size:12.5px;color:var(--dark);padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .12s}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--navy-light);cursor:pointer}
.td-mono{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--teal)}
.avatar{width:32px;height:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--bg);flex-shrink:0}
.av-teal{background:linear-gradient(135deg,var(--teal),var(--blue))}
.av-purple{background:linear-gradient(135deg,var(--purple),#9D5CF6);color:#fff}
.av-red{background:linear-gradient(135deg,var(--red),#FF8FA3);color:#fff}
.av-amber{background:linear-gradient(135deg,var(--amber),#FFD37A)}
.av-green{background:linear-gradient(135deg,var(--teal),#00C88A)}
.av-blue{background:linear-gradient(135deg,var(--blue),#A0CFFF)}
.av-lg{width:48px;height:48px;border-radius:10px;font-size:16px}
.av-xl{width:60px;height:60px;border-radius:12px;font-size:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--slate);letter-spacing:1px;text-transform:uppercase}
.form-input,.form-select,.form-textarea{padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--dark);background:var(--navy-light);font-family:var(--font-body);transition:border-color .18s,box-shadow .18s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,229,160,0.1),0 0 10px rgba(0,229,160,0.08)}
.form-input::placeholder{color:var(--slate-light)}
.form-select{color:var(--dark);cursor:pointer}
.form-select option{background:var(--navy-mid)}
.form-textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--navy-light);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 13px;font-size:12.5px;color:var(--slate);transition:border-color .18s}
.search-bar:focus-within{border-color:rgba(0,229,160,0.4)}
.search-bar input{border:none;background:transparent;outline:none;font-size:12.5px;color:var(--dark);width:180px;font-family:var(--font-body)}
.search-bar input::placeholder{color:var(--slate-light)}
.toggle{width:40px;height:22px;border-radius:11px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:var(--teal);box-shadow:0 0 10px rgba(0,229,160,0.4)}.toggle.off{background:var(--navy-light);border:1px solid var(--border)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;background:var(--navy-mid);border-radius:50%;top:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle.on::after{left:21px}.toggle.off::after{left:3px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--navy-mid);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px var(--border);border:1px solid var(--border2)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--dark)}
.modal-close{font-size:18px;color:var(--slate);cursor:pointer;line-height:1;background:none;border:none;padding:0;transition:color .15s}
.modal-close:hover{color:var(--red)}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideInRight .25s ease;min-width:260px;backdrop-filter:blur(10px);border:1px solid}
.toast-success{background:rgba(0,61,43,0.95);color:var(--teal);border-color:rgba(0,229,160,0.3);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 20px rgba(0,229,160,0.1)}
.toast-error{background:rgba(61,0,20,0.95);color:var(--red);border-color:rgba(255,76,106,0.3)}
.toast-warning{background:rgba(61,46,0,0.95);color:var(--amber);border-color:rgba(240,180,41,0.3)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.filter-tabs{display:flex;gap:4px}
.filter-tab{padding:6px 13px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--slate);background:transparent;transition:all .15s;font-family:var(--font-body)}
.filter-tab.active{background:var(--teal-light);color:var(--teal);border-color:rgba(0,229,160,0.35)}
.filter-tab:hover:not(.active){background:var(--navy-light);color:var(--dark)}
.room-card{background:var(--navy-mid);border-radius:var(--radius);padding:14px;border:1px solid var(--border);cursor:pointer;transition:all .18s}
.room-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);border-color:var(--border2)}
.room-card.occupied{border-color:rgba(0,229,160,0.25);background:rgba(0,229,160,0.04)}
.room-card.maintenance{border-color:rgba(240,180,41,0.25);background:rgba(240,180,41,0.04)}
.ticket{background:var(--navy-mid);border-radius:var(--radius);border:1px solid var(--border);padding:16px;display:flex;gap:14px;transition:border-color .15s}
.ticket:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.2)}

<div id="loading-overlay">
  <div class="loading-logo">BH<span>MS</span></div>

</div>
<div id="app"></div>

<script>
// ============================================================
// BHMS — FRONTEND ONLY (no backend)
// All data lives in-memory; fresh/empty on load
// ============================================================

var MOCK_USERS = [];
var MOCK_ROOMS = [];
var MOCK_TENANTS = [];
var MOCK_INVOICES = [];
var MOCK_MAINTENANCE = [];
var MOCK_ANNOUNCEMENTS = [];
var MOCK_NOTIFICATIONS = [];
var MOCK_LANDLORDS = [];
var MOCK_AUDIT_LOGS = [];
var MOCK_MESSAGES = [];
var MOCK_MONTHLY_REVENUE = [];
var MOCK_OCCUPANCY_HISTORY = [];

var _nextId = 100;
function newId(prefix) { prefix = prefix || ''; return prefix + (++_nextId); }

// ── STUB: api() replaced with local in-memory logic ──────────
function api(endpoint, data) {
  data = data || {};
  return new Promise(function(resolve, reject) {
    setTimeout(function() {
      try { resolve(_localApi(endpoint, data)); }
      catch(e) { reject(e); }
    }, 60);
  });
}

function _localApi(endpoint, data) {
  var action = data.action || '';

  if (endpoint === 'auth') {
    if (action === 'check') {
      if (isAuthed && db.currentUser) return { success: true, user: db.currentUser };
      return { success: false };
    }
    if (action === 'role_check') {
      return { success: true, hasAdmin: MOCK_USERS.some(function(u){return u.role==='System Admin';}), hasLandlord: MOCK_USERS.some(function(u){return u.role==='Landlord';}) };
    }
    if (action === 'login') {
      var u = null;
      for (var i=0; i<MOCK_USERS.length; i++) {
        if (MOCK_USERS[i].email===data.email && MOCK_USERS[i].password===data.password) { u=MOCK_USERS[i]; break; }
      }
      if (!u) throw new Error('Invalid email or password');
      return { success: true, user: { id:u.id, name:u.name, email:u.email, phone:u.phone||'', role:u.role, tenantId:u.tenantId||null } };
    }
    if (action === 'register') {
      var exists = MOCK_USERS.filter(function(u){return u.email===data.email;})[0];
      if (exists) throw new Error('Email already registered');
      var roleLabel = data.role==='admin'?'System Admin':data.role==='landlord'?'Landlord':'Tenant';
      if (roleLabel==='System Admin' && MOCK_USERS.some(function(u){return u.role==='System Admin';})) throw new Error('An admin already exists');
      if (roleLabel==='Landlord'     && MOCK_USERS.some(function(u){return u.role==='Landlord';}))     throw new Error('A landlord already exists');
      var nu = { id:newId('u'), role:roleLabel, name:data.first+' '+data.last, email:data.email, phone:data.phone||'', password:data.password, securityQ:data.securityQ||null, securityA:(data.securityA||'').toLowerCase() };
      MOCK_USERS.push(nu);
      registeredUsers.push({ email:nu.email, role:nu.role });
      return { success: true, user: nu };
    }
    if (action === 'logout') { return { success: true }; }
    if (action === 'check_security') {
      var u2 = MOCK_USERS.filter(function(u){return u.email===data.email;})[0];
      if (!u2) throw new Error('Email not found');
      if (!u2.securityQ) throw new Error('No security question set for this account');
      return { success: true, question: u2.securityQ };
    }
    if (action === 'verify_security') {
      var u3 = MOCK_USERS.filter(function(u){return u.email===data.email;})[0];
      if (!u3 || (u3.securityA||'').toLowerCase() !== (data.answer||'').toLowerCase()) throw new Error('Incorrect answer');
      return { success: true };
    }
    if (action === 'reset_password') {
      var u4 = MOCK_USERS.filter(function(u){return u.email===data.email;})[0];
      if (!u4) throw new Error('Email not found');
      u4.password = data.newPassword;
      return { success: true };
    }
  }

  if (endpoint === 'data') {
    return {
      success: true,
      rooms:            JSON.parse(JSON.stringify(MOCK_ROOMS)),
      tenants:          JSON.parse(JSON.stringify(MOCK_TENANTS)),
      invoices:         JSON.parse(JSON.stringify(MOCK_INVOICES)),
      payments:         [],
      maintenance:      JSON.parse(JSON.stringify(MOCK_MAINTENANCE)),
      announcements:    JSON.parse(JSON.stringify(MOCK_ANNOUNCEMENTS)),
      notifications:    JSON.parse(JSON.stringify(MOCK_NOTIFICATIONS)),
      landlords:        JSON.parse(JSON.stringify(MOCK_LANDLORDS)),
      auditLogs:        JSON.parse(JSON.stringify(MOCK_AUDIT_LOGS)),
      monthlyRevenue:   JSON.parse(JSON.stringify(MOCK_MONTHLY_REVENUE)),
      occupancyHistory: JSON.parse(JSON.stringify(MOCK_OCCUPANCY_HISTORY)),
      registeredUsers:  MOCK_USERS.map(function(u){return {email:u.email,role:u.role};}),
    };
  }

  if (endpoint === 'rooms') {
    if (action === 'add') {
      var r = { id:newId('r'), number:data.number, type:data.type, floor:data.floor||1, price:data.price, capacity:data.capacity||1, status:data.status||'vacant', amenities:data.amenities||[], tenantIds:[] };
      MOCK_ROOMS.push(r);
      MOCK_AUDIT_LOGS.push({id:newId('al'),userId:db.currentUser?db.currentUser.id:'',userName:db.currentUser?db.currentUser.name:'',action:'Added room '+r.number,createdAt:new Date().toISOString()});

  }

  return { success: true };
}

// ── ROUTER ───────────────────────────────────────────────────
var routes = {};
function register(path, fn) { routes[path] = fn; }

function navigate(path) {
  closeNotifPanel();
  if (currentPage !== path) navHistory.push(currentPage);
  currentPage = path;
  window.location.hash = path;
  const fn = routes[path];
  if (fn) fn();
  else console.warn('No route for', path);
}

function goBack() {
  const prev = navHistory.filter(p => p !== '/login' && p !== currentPage).pop();
  navigate(prev || '/dashboard');
}

function resolve() {
  const hash = window.location.hash.replace('#', '') || '/login';
  currentPage = hash;
  const fn = routes[hash];
  if (fn) fn();
  else navigate('/login');
}

// ── ROOM CAPACITY ─────────────────────────────────────────────
var ROOM_TYPE_CAPACITY = {'Single':1,'Standard Single':1,'Double':2,'Deluxe Double':2,'Triple':3,'Suite':4,'Family':4,'Quadruple':4};
function roomCapacity(room) { return room.capacity > 0 ? room.capacity : (ROOM_TYPE_CAPACITY[room.type]||1); }
function roomTenants(room)  { return Array.isArray(room.tenantIds) ? room.tenantIds : (room.tenantId ? [room.tenantId] : []); }
function roomOccupancy(room){ return roomTenants(room).length; }
function roomIsFull(room)   { return roomOccupancy(room) >= roomCapacity(room); }
function roomStatusFromOccupancy(room) {
  const occ=roomOccupancy(room); if(occ===0) return 'vacant'; if(occ>=roomCapacity(room)) return 'occupied'; return 'partial';
}
function migrateRoomSchema(room) {
  if(!Array.isArray(room.tenantIds)) { room.tenantIds=room.tenantId?[room.tenantId]:[]; delete room.tenantId; }
  if(!room.capacity) room.capacity=roomCapacity(room);
  if(room.status !== 'maintenance') room.status=roomStatusFromOccupancy(room);
}

function stats() {
  db.rooms.forEach(r=>migrateRoomSchema(r));
  return {
    totalRooms:    db.rooms.length,
    occupied:      db.rooms.filter(r=>r.status==='occupied').length,
    partial:       db.rooms.filter(r=>r.status==='partial').length,
    vacant:        db.rooms.filter(r=>r.status==='vacant').length,
    maintenance:   db.rooms.filter(r=>r.status==='maintenance').length,
    activeTenants: db.tenants.filter(t=>t.status!=='inactive').length,
    unpaidInvoices:db.invoices.filter(i=>i.status!=='paid').length,
    overdueAmount: db.invoices.filter(i=>i.status==='overdue').reduce((s,i)=>s+i.amount,0),
    monthRevenue:  db.monthlyRevenue.length ? db.monthlyRevenue.at(-1).amount : 0,
    openMaint:     db.maintenance.filter(m=>m.status==='open').length,
  };
}

// ── TOAST ─────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const icons={success:SVG.check,error:SVG.x,warning:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:inline-block;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`};
  const t=document.createElement('div'); t.className=`toast toast-${type}`;
  t.innerHTML=`<span>${icons[type]||'•'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},3000);
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal({title,body,onConfirm,confirmText='Save',confirmClass='btn-primary'}) {
  document.getElementById('modal-overlay')?.remove();
  const ov=document.createElement('div'); ov.className='modal-overlay'; ov.id='modal-overlay';
  ov.innerHTML=`<div class="modal fade-in"><div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close">${SVG.x}</button></div><div class="modal-body">${body}</div><div class="modal-footer"><button class="btn btn-ghost" id="mc">Cancel</button><button class="btn ${confirmClass}" id="mok">${confirmText}</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.modal-close').onclick=()=>ov.remove();
  ov.querySelector('#mc').onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  if(onConfirm) ov.querySelector('#mok').onclick=()=>onConfirm(ov);
  return ov;
}

function tenantUserId(tenantObj) {
  if(!tenantObj) return null;
  if(tenantObj.userId) return tenantObj.userId;
  const u=registeredUsers.find(u=>u.email===tenantObj.email); return u?u.id:null;
}

// ── NOTIFICATIONS ────────────────────────────────────────────
var notifPanelOpen=false; let notifActiveTab='all';
function getMyNotifs() {
  const u=db.currentUser; if(!u) return [];
  return (db.notifications||[]).filter(n=>!n.targetUserId||n.targetUserId===u.id);
}
function getUnreadCount(){ return getMyNotifs().filter(n=>!n.read).length; }

function renderNotifBadge() {
  const btn=document.getElementById('notif-bell');
  const badge2=document.getElementById('notif-badge');
  if(!btn) return;
  const count=getUnreadCount();
  if(count>0){btn.classList.add('has-unread');if(badge2){badge2.textContent=count>9?'9+':count;badge2.style.display='flex';}}
  else{btn.classList.remove('has-unread');if(badge2)badge2.style.display='none';}
}

async function markAllRead() {
  try { await api('notifications',{action:'mark_all_read'}); await syncNotifs(); notifActiveTab='all'; renderNotifBadge(); renderNotifList(); } catch(_){}
}
async function markOneRead(id) {
  try { await api('notifications',{action:'mark_read',id}); const n=getMyNotifs().find(n=>n.id===id); if(n)n.read=true; renderNotifBadge(); renderNotifList(); } catch(_){}
}
async function deleteNotif(id) {
  try { await api('notifications',{action:'delete',id}); db.notifications=db.notifications.filter(n=>n.id!==id); renderNotifBadge(); renderNotifList(); } catch(_){}
}
async function clearAllNotifs() {
  try { await api('notifications',{action:'clear'}); db.notifications=[]; renderNotifBadge(); renderNotifList(); } catch(_){}
}

function toggleNotifPanel() { notifPanelOpen=!notifPanelOpen; if(notifPanelOpen)openNotifPanel(); else closeNotifPanel(); }

function openNotifPanel() {
  notifPanelOpen=true; notifActiveTab='all'; closeNotifPanel();
  const panel=document.createElement('div'); panel.id='notif-panel'; panel.className='notif-panel';
  panel.addEventListener('click',e=>e.stopPropagation());
  document.body.appendChild(panel); renderNotifList();
  setTimeout(()=>document.addEventListener('click',closeOnOutsideClick),10);
}
function closeNotifPanel(){ notifPanelOpen=false; document.getElementById('notif-panel')?.remove(); document.removeEventListener('click',closeOnOutsideClick); }
function closeOnOutsideClick(e){ const panel=document.getElementById('notif-panel'); const bell=document.getElementById('notif-bell'); if(panel&&!panel.contains(e.target)&&bell&&!bell.contains(e.target))closeNotifPanel(); }

function renderNotifList() {
  const panel=document.getElementById('notif-panel'); if(!panel) return;
  const icoSVG={teal:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,amber:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,red:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,blue:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,purple:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`};
  const timeAgo=iso=>{const diff=Date.now()-new Date(iso).getTime();const m=Math.floor(diff/60000),h=Math.floor(m/60),d=Math.floor(h/24);if(d>0)return d+'d ago';if(h>0)return h+'h ago';if(m>0)return m+'m ago';return 'Just now';};
  const all=getMyNotifs(); const unread=all.filter(n=>!n.read); const list=notifActiveTab==='unread'?unread:all;
  panel.innerHTML=`<div class="notif-panel-head"><div class="notif-panel-title">Notifications${unread.length>0?`<span style="background:var(--red);color:#fff;font-size:9px;font-family:var(--font-mono);font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;">${unread.length}</span>`:''}</div><div class="notif-panel-actions">${unread.length>0?`<button class="btn btn-ghost btn-sm" id="btn-mark-all" style="font-size:10px;padding:4px 8px;">Mark all read</button>`:''} ${all.length>0?`<button class="btn btn-ghost btn-sm" id="btn-clear-all" style="font-size:10px;padding:4px 8px;">Clear</button>`:''}</div></div><div class="notif-tabs"><button class="notif-tab ${notifActiveTab==='all'?'active':''}" id="ntab-all">All <span style="font-family:var(--font-mono);font-size:10px;">(${all.length})</span></button><button class="notif-tab ${notifActiveTab==='unread'?'active':''}" id="ntab-unread">Unread <span style="font-family:var(--font-mono);font-size:10px;">(${unread.length})</span></button></div><div class="notif-list" id="notif-list-body">${list.length===0?`<div class="notif-empty"><div class="notif-empty-icon">${SVG.bell}</div><p style="font-size:13px;font-weight:600;color:var(--dark);margin-bottom:4px;">${notifActiveTab==='unread'?'All caught up!':'No notifications'}</p><p style="font-size:12px;">New activity will appear here.</p></div>`:list.map(n=>`<div class="notif-item ${n.read?'':'unread'}" data-nid="${n.id}" style="cursor:${n.route?'pointer':'default'}"><div class="notif-ico ni-${n.iconColor||'blue'}">${icoSVG[n.iconColor||'blue']||icoSVG.blue}</div><div style="flex:1;min-width:0;"><div class="notif-item-title">${n.title}${n.route?'<span style="color:var(--teal);font-size:10px;margin-left:4px;">→</span>':''}</div><div class="notif-item-body">${n.body}</div><div class="notif-item-time">${timeAgo(n.createdAt)}</div></div><button class="notif-del-btn" data-del="${n.id}" style="background:none;border:none;color:var(--slate);cursor:pointer;padding:4px;flex-shrink:0;border-radius:4px;transition:color .15s;" onmouseenter="this.style.color='var(--red)'" onmouseleave="this.style.color='var(--slate)'">${SVG.x}</button></div>`).join('')}</div>`;
  panel.querySelector('#ntab-all')?.addEventListener('click',e=>{e.stopPropagation();notifActiveTab='all';renderNotifList();});
  panel.querySelector('#ntab-unread')?.addEventListener('click',e=>{e.stopPropagation();notifActiveTab='unread';renderNotifList();});
  panel.querySelector('#btn-mark-all')?.addEventListener('click',e=>{e.stopPropagation();markAllRead();});
  panel.querySelector('#btn-clear-all')?.addEventListener('click',e=>{e.stopPropagation();clearAllNotifs();});
  panel.querySelectorAll('.notif-item[data-nid]').forEach(el=>{el.addEventListener('click',()=>{const nid=el.dataset.nid;const n=getMyNotifs().find(n=>n.id===nid);markOneRead(nid);if(n?.route){closeNotifPanel();navigate(n.route);}});});
  panel.querySelectorAll('.notif-del-btn[data-del]').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();deleteNotif(btn.dataset.del);});});
}

// ── CLOCK ────────────────────────────────────────────────────
var _DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function updateTopbarClock(){const el=document.getElementById('topbar-clock');const dl=document.getElementById('topbar-date');if(!el)return;const now=new Date();el.textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;if(dl)dl.textContent=`${_DAYS[now.getDay()]}, ${_MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;}
setInterval(updateTopbarClock,1000);

function pageAuth() {
  document.getElementById('loading-overlay').style.display='none';
  const hasAdmin=registeredUsers.some(u=>u.role==='System Admin');
  const hasLandlord=registeredUsers.some(u=>u.role==='Landlord');
  document.getElementById('app').innerHTML=`<div class="auth-layout"><div class="auth-left"><canvas class="auth-canvas" id="auth-canvas"></canvas><div class="auth-left-content"><div style="font-family:var(--font-head);font-size:34px;font-weight:800;color:var(--dark);margin-bottom:8px;letter-spacing:-1px;">BH<span style="color:var(--teal);text-shadow:0 0 30px rgba(0,229,160,0.5);">MS</span></div><div style="font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--dark);line-height:1.3;margin-bottom:14px;letter-spacing:-.5px;">Manage your boarding<br>house smarter.</div><div style="color:var(--slate);font-size:14px;line-height:1.7;margin-bottom:32px;">All-in-one platform for landlords and tenants.</div>${['Smart room & tenant management','Automated billing & receipts','Real-time maintenance tracking','Role-based secure access','Revenue analytics & reports'].map((f,i)=>`<div style="display:flex;align-items:center;gap:10px;color:var(--dark);font-size:13px;margin-bottom:12px;animation:fadeIn .5s ease both;animation-delay:${0.1+i*0.08}s;"><div style="width:24px;height:24px;border-radius:50%;background:var(--teal-light);border:1px solid rgba(0,229,160,.4);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">${SVG.check}</div>${f}</div>`).join('')}<div style="margin-top:24px;"><button class="theme-toggle-btn" onclick="toggleTheme()" id="auth-theme-btn"><span id="auth-theme-icon">${document.documentElement.getAttribute('data-theme')==='light'?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`}</span><span id="auth-theme-label">${document.documentElement.getAttribute('data-theme')==='light'?'Dark Mode':'Light Mode'}</span></button></div></div></div><div class="auth-right" id="auth-panel" style="overflow-y:auto;"></div></div>`;
  
  // Canvas animation
  const canvas=document.getElementById('auth-canvas');const ctx=canvas.getContext('2d');let W,H,particles=[],animId;
  function resize(){W=canvas.width=canvas.offsetWidth;H=canvas.height=canvas.offsetHeight;}
  function initParticles(){particles=[];const count=Math.floor(W*H/8000);for(let i=0;i<count+40;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2.5+.5,opacity:Math.random()*.6+.2,color:Math.random()>.5?'0,229,160':'88,166,255',pulse:Math.random()*Math.PI*2,pulseSpeed:Math.random()*.02+.005});}
  function drawBg(){const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#0D1117');grad.addColorStop(.4,'#0F1419');grad.addColorStop(1,'#0A1A12');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);[{x:W*.15,y:H*.2,r:220,c:'rgba(0,229,160,0.15)'},{x:W*.85,y:H*.7,r:280,c:'rgba(88,166,255,0.1)'},{x:W*.5,y:H*.5,r:350,c:'rgba(210,168,255,0.05)'}].forEach(o=>{const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,o.c);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();});}
  function drawConnections(){for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<120){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(0,229,160,${(1-dist/120)*0.2})`;ctx.lineWidth=.8;ctx.stroke();}}}
  function animate(){animId=requestAnimationFrame(animate);drawBg();drawConnections();particles.forEach(p=>{p.pulse+=p.pulseSpeed;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;const a=p.opacity*(0.6+0.4*Math.sin(p.pulse));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.color},${a})`;ctx.fill();if(p.r>1.8){ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);ctx.fillStyle=`rgba(${p.color},${a*0.15})`;ctx.fill();}});}
  resize();initParticles();animate();
  const ro=new ResizeObserver(()=>{cancelAnimationFrame(animId);resize();initParticles();animate();});ro.observe(canvas.parentElement);

ass="btn btn-ghost btn-sm" style="width:100%;font-size:10px;padding:4px 6px;" data-reg-role="${role}" ${(role==='admin'&&hasAdmin)||(role==='landlord'&&hasLandlord)?'disabled':''}>${(role==='admin'&&hasAdmin)||(role==='landlord'&&hasLandlord)?SVG.check+' '+btnText:btnText}</button></div>`).join('')}</div></div></div>`;

  }

  async function doLogin(){
    const email=document.getElementById('login-email')?.value.trim();
    const pwd=document.getElementById('login-pwd')?.value;
    if(!email||!pwd){showToast('Enter email and password','error');return;}
    const btn=document.getElementById('login-btn');
    btn.disabled=true; btn.textContent='Signing in...';
    try {
      const res=await api('auth',{action:'login',email,password:pwd});
      db.currentUser=res.user;
      cancelAnimationFrame(animId);
      isAuthed=true; navHistory=[];
      await syncDB();
      showToast(`Welcome back, ${db.currentUser.name.split(' ')[0]}!`,'success');
      if(db.currentUser.role!=='Tenant'){setTimeout(()=>startAutoBillingScheduler(),800);}
      setTimeout(()=>navigate('/dashboard'),400);
    } catch(e){
      showToast(e.message,'error');
      btn.disabled=false; btn.innerHTML=`Sign In ${SVG.arrow}`;
    }
  }

    document.getElementById('auth-panel').innerHTML=`<div style="animation:fadeIn .25s ease both;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;"><button id="reg-back" style="background:var(--navy-light);border:1px solid var(--border);color:var(--slate);border-radius:7px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;">${SVG.back} Back</button><div><div style="font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--dark);letter-spacing:-.4px;">Create Account</div><div style="display:flex;align-items:center;gap:6px;margin-top:2px;"><span style="display:inline-flex;align-items:center;gap:4px;background:${roleBg};color:${roleColor};border:1px solid ${roleBorder};border-radius:100px;padding:2px 10px;font-size:11px;font-weight:700;font-family:var(--font-mono);">${roleIco} ${roleLabel}</span></div></div></div>${role==='admin'?`<div style="background:rgba(210,168,255,0.08);border:1px solid rgba(210,168,255,0.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--purple);display:flex;gap:8px;align-items:center;">${SVG.star} <span>Only <strong>one Admin</strong> account allowed.</span></div>`:''}${role==='landlord'?`<div style="background:rgba(0,229,160,0.06);border:1px solid rgba(0,229,160,0.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--teal);display:flex;gap:8px;align-items:center;">${SVG.home} <span>Only <strong>one Landlord</strong> allowed.</span></div>`:''}${role==='tenant'?`<div style="background:rgba(88,166,255,0.08);border:1px solid rgba(88,166,255,0.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--blue);display:flex;gap:8px;align-items:center;">${SVG.user} <span>The landlord will assign your room after registration.</span></div>`:''}
    <div style="display:flex;flex-direction:column;gap:13px;"><div class="form-grid"><div class="form-group"><label class="form-label">First Name *</label><input class="form-input" id="reg-first" placeholder="Juan"/></div><div class="form-group"><label class="form-label">Last Name *</label><input class="form-input" id="reg-last" placeholder="dela Cruz"/></div></div><div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="reg-email" type="email" placeholder="email@example.com"/></div><div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="reg-phone" placeholder="+63 9XX XXX XXXX"/></div><div class="form-grid"><div class="form-group"><label class="form-label">Password *</label><input class="form-input" id="reg-pwd" type="password" placeholder="Min 6 characters"/></div><div class="form-group"><label class="form-label">Confirm *</label><input class="form-input" id="reg-confirm" type="password" placeholder="Repeat password"/></div></div><div style="padding:12px 14px;background:rgba(0,140,255,0.06);border:1px solid rgba(0,140,255,0.2);border-radius:8px;"><div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;" style="display:inline-flex;align-items:center;gap:5px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Security Question</div><div class="form-group" style="margin-bottom:10px;"><label class="form-label">Security Question</label><select class="form-select" id="reg-sq"><option value="">Select a question...</option>${["What is your mother's maiden name?","What was the name of your first pet?","What city were you born in?","What is the name of your elementary school?","What was your childhood nickname?","What is your oldest sibling's middle name?"].map(q=>`<option>${q}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Your Answer *</label><input class="form-input" id="reg-sa" type="text" placeholder="Your answer (case-insensitive)"/></div></div><button class="btn btn-primary btn-full" id="reg-submit" style="padding:12px;font-size:14px;border-radius:8px;font-family:var(--font-head);">Create ${roleLabel} Account ${SVG.arrow}</button><p style="font-size:11px;color:var(--slate);text-align:center;">Already have an account? <span style="color:var(--teal);cursor:pointer;font-weight:600;" id="go-login">Sign in →</span></p></div></div>`;
    document.getElementById('reg-back').addEventListener('click',renderLogin);

  async function doRegister(role){
    const first=document.getElementById('reg-first')?.value.trim();
    const last=document.getElementById('reg-last')?.value.trim();
    const email=document.getElementById('reg-email')?.value.trim().toLowerCase();
    const phone=document.getElementById('reg-phone')?.value.trim();
    const pwd=document.getElementById('reg-pwd')?.value;
    const confirm=document.getElementById('reg-confirm')?.value;
    const secQ=document.getElementById('reg-sq')?.value.trim()||'';
    const secA=document.getElementById('reg-sa')?.value.trim()||'';
    if(!first||!last){showToast('Enter your full name','error');return;}
    if(!email){showToast('Enter your email','error');return;}
    if(!/\S+@\S+\.\S+/.test(email)){showToast('Enter a valid email','error');return;}
    if(!pwd||pwd.length<6){showToast('Password must be at least 6 characters','error');return;}
    if(pwd!==confirm){showToast('Passwords do not match','error');return;}
    if(secQ&&!secA){showToast('Enter an answer for your security question','error');return;}
    const btn=document.getElementById('reg-submit');btn.disabled=true;btn.textContent='Creating account...';
    try{
      await api('auth',{action:'register',first,last,email,phone,password:pwd,role,securityQ:secQ||null,securityA:secA||null});
      const roleLabel=role==='admin'?'System Admin':role==='landlord'?'Landlord':'Tenant';
      renderSuccess(first+' '+last,roleLabel,email);
    }catch(e){
      showToast(e.message,'error');
      btn.disabled=false;
    }
  }

  function renderForgotPassword(){
    document.getElementById('auth-panel').innerHTML=`<div style="animation:fadeIn .25s ease both;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;"><button id="fp-back" style="background:var(--navy-light);border:1px solid var(--border);color:var(--slate);border-radius:7px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;">${SVG.back} Back</button><div style="font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--dark);">Password Recovery</div></div><div class="form-group" style="margin-bottom:14px;"><label class="form-label">Email Address</label><input class="form-input" id="fp-email" type="email" placeholder="Enter your registered email"/></div><button class="btn btn-primary btn-full" id="fp-submit" style="padding:12px;font-size:14px;border-radius:8px;">Continue ${SVG.arrow}</button></div>`;

  function renderSecurityQuestion(email,question){

      try{await api('auth',{action:'verify_security',email,answer});renderResetPassword(email);}
      catch(e){showToast(e.message,'error');}
    });
  }

  function renderResetPassword(email){
    document.getElementById('auth-panel').innerHTML=`<div style="animation:fadeIn .25s ease both;"><div style="font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--dark);margin-bottom:20px;">Set New Password</div><div class="form-group" style="margin-bottom:12px;"><label class="form-label">New Password</label><input class="form-input" id="new-pwd" type="password" placeholder="Min 6 characters"/></div><div class="form-group" style="margin-bottom:16px;"><label class="form-label">Confirm Password</label><input class="form-input" id="conf-pwd" type="password" placeholder="Repeat password"/></div><button class="btn btn-primary btn-full" id="reset-submit" style="padding:12px;">Update Password</button></div>`;

      if(np.length<6){showToast('Minimum 6 characters','error');return;}
      try{await api('auth',{action:'reset_password',email,newPassword:np});showToast('Password updated! Please sign in.','success');renderLogin();}  // async ok
      catch(e){showToast(e.message,'error');}
    });
  }

  function renderSuccess(name,roleLabel,email){
    document.getElementById('auth-panel').innerHTML=`<div style="animation:fadeIn .3s ease both;text-align:center;padding:20px 0;"><div style="color:var(--teal);margin-bottom:18px;display:flex;justify-content:center;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div style="font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--dark);margin-bottom:8px;">Account Created!</div><div style="font-size:13px;color:var(--slate);margin-bottom:6px;">Welcome to BHMS, <strong style="color:var(--dark);">${name}</strong>.</div><div style="display:inline-block;background:var(--navy-light);border:1px solid var(--border);border-radius:8px;padding:8px 16px;margin-bottom:24px;"><span style="font-family:var(--font-mono);font-size:11px;color:var(--teal);">${roleLabel}</span><span style="font-size:11px;color:var(--slate);margin-left:8px;">${email}</span></div><button class="btn btn-primary btn-full" id="go-to-login" style="padding:12px;font-size:14px;font-family:var(--font-head);">Go to Sign In ${SVG.arrow}</button></div>`;
    document.getElementById('go-to-login').addEventListener('click',renderLogin);
  }

  renderLogin();
}

function pageDashboard(){
  if(!db.currentUser){navigate('/login');return;}
  const role=db.currentUser.role;
  if(role==='System Admin') return pageDashboardAdmin();
  if(role==='Tenant')       return pageDashboardTenant();
  pageDashboardLandlord();
}

var roomFilter='all';
function pageRooms(){ roomFilter='all'; window._rsearch=''; const canEdit=db.currentUser.role==='Landlord'||db.currentUser.role==='System Admin'; buildShell(); setTopbar('Room Management',`<div class="search-bar">${SVG.search}<input id="rsearch" placeholder="Search rooms..."/></div>${canEdit?'<button class="btn btn-primary" id="add-room">+ Add Room</button>':''}`); drawRooms(); document.getElementById('add-room')?.addEventListener('click',addRoomModal); document.getElementById('rsearch').addEventListener('input',e=>{window._rsearch=e.target.value.toLowerCase();drawRooms();}); }

function drawRooms(){
  db.rooms.forEach(r=>migrateRoomSchema(r));
  const canEdit=db.currentUser.role==='Landlord'||db.currentUser.role==='System Admin';
  const s=stats();
  let rooms=db.rooms;
  if(roomFilter!=='all') rooms=rooms.filter(r=>r.status===roomFilter);
  if(window._rsearch) rooms=rooms.filter(r=>r.number.includes(window._rsearch)||r.type.toLowerCase().includes(window._rsearch));
  const cntPartial=db.rooms.filter(r=>r.status==='partial').length;
  const totalSlots=db.rooms.reduce((s,r)=>s+roomCapacity(r),0);
  const usedSlots=db.rooms.reduce((s,r)=>s+roomOccupancy(r),0);
  getBody().innerHTML=`<div class="fade-in"><div class="flex-between" style="margin-bottom:16px;"><div class="filter-tabs">${[['all','All',s.totalRooms],['occupied','Occupied',s.occupied],['partial','Partial',cntPartial],['vacant','Vacant',s.vacant],['maintenance','Maintenance',s.maintenance]].map(([v,l,c])=>`<button class="filter-tab ${roomFilter===v?'active':''}" data-f="${v}">${l} (${c})</button>`).join('')}</div></div><div class="card" style="margin-bottom:16px;padding:14px 18px;"><div class="flex-between" style="margin-bottom:8px;"><span style="font-size:12px;font-weight:600;color:var(--dark);">Occupancy</span><span style="font-size:12px;font-weight:700;color:var(--teal);">${totalSlots>0?Math.round(usedSlots/totalSlots*100):0}% (${usedSlots}/${totalSlots} slots)</span></div><div style="height:6px;background:var(--navy-light);border-radius:4px;overflow:hidden;"><div style="width:${totalSlots>0?Math.round(usedSlots/totalSlots*100):0}%;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:4px;"></div></div></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;">${rooms.map(room=>{const cap=roomCapacity(room);const tIds=roomTenants(room);const occ=tIds.length;const tenantNames=tIds.map(tid=>{const t=db.tenants.find(t=>t.id===tid);return t?t.name:null;}).filter(Boolean);const isFull=roomIsFull(room);return`<div class="room-card ${room.status}" data-rid="${room.id}"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div style="font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--dark);">${room.number}</div><span class="text-xs" style="color:var(--slate);">F${room.floor}</span></div><div class="text-xs" style="margin:2px 0 4px;color:var(--slate);">${room.type}</div><div style="font-size:12px;font-weight:600;color:var(--teal);">${fmtCur(room.price)}/mo</div><div style="margin:6px 0;display:flex;align-items:center;gap:5px;"><div style="flex:1;height:4px;background:var(--navy-light);border-radius:2px;overflow:hidden;"><div style="width:${cap>0?Math.round(occ/cap*100):0}%;height:100%;background:${isFull?'var(--teal)':occ>0?'var(--blue)':'var(--navy-light)'};border-radius:2px;transition:width .3s;"></div></div><span style="font-size:10px;font-family:var(--font-mono);color:${isFull?'var(--teal)':occ>0?'var(--blue)':'var(--slate)'};">${occ}/${cap}</span></div><div class="text-xs" style="margin-bottom:6px;min-height:14px;">${tenantNames.length>0?tenantNames.map(n=>`<div style="color:var(--dark);font-weight:500;">${n}</div>`).join(''):'<span style="color:var(--slate);">— Vacant —</span>'}</div><div style="display:flex;justify-content:space-between;align-items:center;">${badge(room.status)}${canEdit?`<button class="btn btn-ghost btn-sm edit-room-btn" data-edit="${room.id}">Edit</button>`:''}</div></div>`;}).join('')}</div>`;
  document.querySelectorAll('.filter-tab').forEach(t=>t.addEventListener('click',()=>{roomFilter=t.dataset.f;drawRooms();}));
  if(canEdit) document.querySelectorAll('.edit-room-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();editRoomModal(b.dataset.edit);}));
  document.querySelectorAll('[data-rid]').forEach(c=>c.addEventListener('click',e=>{if(!e.target.closest('button'))roomDetailModal(c.dataset.rid);}));
}

function roomDetailModal(id){
  const canEdit=db.currentUser.role==='Landlord'||db.currentUser.role==='System Admin';
  const r=db.rooms.find(r=>r.id===id);if(!r)return;migrateRoomSchema(r);
  const cap=roomCapacity(r),occ=roomOccupancy(r),tIds=roomTenants(r);
  const tenants=tIds.map(tid=>db.tenants.find(t=>t.id===tid)).filter(Boolean);
  openModal({title:`Room ${r.number} Details`,body:`<div style="display:flex;gap:12px;align-items:center;margin-bottom:20px;"><div style="width:60px;height:60px;border-radius:12px;background:var(--teal-dim);border:1px solid rgba(0,229,160,0.2);display:flex;align-items:center;justify-content:center;">${SVG.home}</div><div><div style="font-size:18px;font-weight:700;color:var(--dark);">Room ${r.number}</div><div class="text-sm">${r.type} · Floor ${r.floor}</div><div style="margin-top:4px;display:flex;gap:6px;align-items:center;">${badge(r.status)}<span style="font-size:11px;font-family:var(--font-mono);color:var(--teal);">${occ}/${cap} tenants</span></div></div><div style="margin-left:auto;text-align:right;"><div style="font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--dark);">${fmtCur(r.price)}</div><div class="text-xs">per month</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">${[['Type',r.type],['Rate',fmtCur(r.price)],['Floor',r.floor],['Capacity',`${cap} tenant${cap>1?'s':''}`]].map(([l,v])=>`<div><div class="text-xs" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;">${l}</div><div style="font-weight:500;">${v}</div></div>`).join('')}<div style="grid-column:1/-1"><div class="text-xs" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;">Amenities</div><div style="font-weight:500;">${r.amenities?.join(' · ')||'—'}</div></div></div>${tenants.length>0?`<div style="padding:14px;background:rgba(0,229,160,0.06);border-radius:8px;border:1px solid rgba(0,229,160,0.2);"><div class="text-xs" style="color:var(--teal);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:10px;">Current Tenants (${occ}/${cap})</div>${tenants.map(t=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">${av(t.name)}<div><div style="font-weight:700;font-size:13px;color:var(--dark);">${t.name}</div><div class="text-xs">${t.email} · ${t.phone}</div></div></div>`).join('')}${occ<cap?`<div style="margin-top:8px;padding:6px 10px;background:rgba(0,140,255,0.08);border-radius:6px;font-size:11px;color:var(--blue);">${cap-occ} slot${cap-occ>1?'s':''} still available</div>`:''}</div>`:'<div class="alert-info">This room is currently unoccupied.</div>'}`,confirmText:canEdit?'Edit Room':'Close',confirmClass:canEdit?'btn-primary':'btn-ghost',onConfirm:ov=>{ov.remove();if(canEdit)editRoomModal(id);}});
}

function addRoomModal(){
  const typeOpts=[{v:'Single',cap:1},{v:'Standard Single',cap:1},{v:'Double',cap:2},{v:'Deluxe Double',cap:2},{v:'Triple',cap:3},{v:'Suite',cap:4},{v:'Family',cap:4}];
  openModal({title:'Add New Room',body:`<div class="form-grid"><div class="form-group"><label class="form-label">Room Number *</label><input class="form-input" id="rn" placeholder="e.g. 306"/></div><div class="form-group"><label class="form-label">Floor</label><select class="form-select" id="rf">${[1,2,3,4,5].map(f=>`<option>${f}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Room Type *</label><select class="form-select" id="rt" onchange="(function(s){var cap={'Single':1,'Standard Single':1,'Double':2,'Deluxe Double':2,'Triple':3,'Suite':4,'Family':4};document.getElementById('rc').value=cap[s.value]||1;})(this)">${typeOpts.map(t=>`<option value="${t.v}">${t.v}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Capacity *</label><input class="form-input" id="rc" type="number" min="1" max="10" value="1" style="font-weight:700;color:var(--teal);"/></div><div class="form-group"><label class="form-label">Monthly Rate (₱) *</label><input class="form-input" id="rp" type="number" placeholder="4500"/></div><div class="form-group"><label class="form-label">Status</label><select class="form-select" id="rs"><option value="vacant">Vacant</option><option value="maintenance">Maintenance</option></select></div><div class="form-group form-full"><label class="form-label">Amenities (comma-separated)</label><input class="form-input" id="ram" placeholder="e.g. AC, WiFi, TV" value="WiFi"/></div></div>`,confirmText:'Add Room',
  onConfirm:async ov=>{
    const n=ov.querySelector('#rn').value.trim(),p=parseInt(ov.querySelector('#rp').value),cap=parseInt(ov.querySelector('#rc').value)||1;
    if(!n||!p){showToast('Fill required fields','error');return;}
    const amenStr=ov.querySelector('#ram')?.value||'WiFi';
    const amenities=amenStr.split(',').map(a=>a.trim()).filter(Boolean);
    try{
      const r=await api('rooms',{action:'add',number:n,type:ov.querySelector('#rt').value,floor:parseInt(ov.querySelector('#rf').value),price:p,capacity:cap,status:ov.querySelector('#rs').value,amenities});
      await syncDB();ov.remove();showToast(`Room ${n} added!`,'success');drawRooms();
    }catch(e){showToast(e.message,'error');}
  }});
}

function editRoomModal(id){
  const r=db.rooms.find(r=>r.id===id);if(!r)return;migrateRoomSchema(r);
  const cap=roomCapacity(r),occ=roomOccupancy(r);
  const allTypes=['Single','Standard Single','Double','Deluxe Double','Triple','Suite','Family'];
  openModal({title:`Edit Room ${r.number}`,body:`<div class="form-grid"><div class="form-group"><label class="form-label">Room Number</label><input class="form-input" id="rn" value="${r.number}"/></div><div class="form-group"><label class="form-label">Floor</label><select class="form-select" id="rf">${[1,2,3,4,5].map(f=>`<option ${r.floor==f?'selected':''}>${f}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Room Type</label><select class="form-select" id="rt" onchange="(function(s){var cap={'Single':1,'Standard Single':1,'Double':2,'Deluxe Double':2,'Triple':3,'Suite':4,'Family':4};document.getElementById('rc').value=cap[s.value]||1;})(this)">${allTypes.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Capacity *</label><input class="form-input" id="rc" type="number" min="${occ}" max="10" value="${cap}" style="font-weight:700;color:var(--teal);"/><div style="font-size:10px;color:var(--slate);margin-top:3px;">Currently ${occ}/${cap}. Min: ${occ}.</div></div><div class="form-group"><label class="form-label">Monthly Rate (₱)</label><input class="form-input" id="rp" type="number" value="${r.price}"/></div><div class="form-group"><label class="form-label">Status</label><select class="form-select" id="rs">${['occupied','partial','vacant','maintenance'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><div class="form-group form-full"><label class="form-label">Amenities</label><input class="form-input" id="ram" value="${(r.amenities||[]).join(', ')}"/></div></div>`,confirmText:'Save',
  onConfirm:async ov=>{
    const newCap=parseInt(ov.querySelector('#rc').value)||1;
    if(newCap<occ){showToast(`Capacity can't be less than current occupancy (${occ})`,'error');return;}
    const amenStr=ov.querySelector('#ram')?.value||'';
    const amenities=amenStr.split(',').map(a=>a.trim()).filter(Boolean);
    const manualStatus=ov.querySelector('#rs').value;
    try{
      await api('rooms',{action:'edit',id,number:ov.querySelector('#rn').value.trim()||r.number,type:ov.querySelector('#rt').value,floor:parseInt(ov.querySelector('#rf').value)||r.floor,price:parseInt(ov.querySelector('#rp').value)||r.price,capacity:newCap,status:manualStatus,amenities});
      await syncDB();ov.remove();showToast('Room updated!','success');drawRooms();
    }catch(e){showToast(e.message,'error');}
  }});
}

// ══════════════════════════════════════════════════════════════
// AUTO-BILLING ENGINE
// Runs once per session on login + every 60 min thereafter.
// Generates invoices when payDay arrives, marks overdue,
// sends tiered reminder notifications — all saved to MySQL.
// ══════════════════════════════════════════════════════════════
var _autoBillingRunning = false;

async function runAutoBillingEngine(silent = false) {
  if (_autoBillingRunning) return;
  _autoBillingRunning = true;
  try {
    const res = await api('billing', { action: 'auto_billing' });
    await syncDB();
    if (!silent) {
      if (res.generated > 0)
        showToast(`Auto-billing: ${res.generated} invoice${res.generated > 1 ? 's' : ''} generated`, 'success');
      if (res.markedOverdue > 0)
        showToast(`${res.markedOverdue} invoice${res.markedOverdue > 1 ? 's' : ''} marked overdue`, 'warning');
    }
    renderNotifBadge();
    // Refresh billing page if open
    if (currentPage === '/billing') drawBilling();
    if (currentPage === '/dashboard') pageDashboard();
  } catch(e) {
    console.warn('Auto-billing engine error:', e.message);
  }
  _autoBillingRunning = false;
}

// Kick off engine: runs silently on boot, then every 60 min
function startAutoBillingScheduler() {
  runAutoBillingEngine(true);                        // silent on login
  setInterval(() => runAutoBillingEngine(false), 60 * 60 * 1000);
}

function drawBilling() {
  const s          = stats();
  const today      = new Date();
  const paidAmt    = db.invoices.filter(i => i.status === 'paid').reduce((s, i) => s + i.amount, 0);
  const pendingAmt = db.invoices.filter(i => i.status === 'pending').reduce((s, i) => s + i.amount, 0);
  const overdueAmt = db.invoices.filter(i => i.status === 'overdue').reduce((s, i) => s + i.amount, 0);

  // Build per-tenant auto-billing schedule
  const activeTenants = db.tenants.filter(t => t.status !== 'inactive');
  const currentPeriod = today.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
  const scheduleRows  = activeTenants.map(t => {
    const room        = db.rooms.find(r => r.id === t.roomId);
    const rent        = room ? room.price : 4500;
    const total       = rent + 150 + 150; // rent + water + elec
    const payDay      = Math.min(t.payDay || 5, 28);
    const dueDate     = new Date(today.getFullYear(), today.getMonth(), payDay);
    const dueDateStr  = dueDate.toISOString().split('T')[0];
    const daysLeft    = Math.ceil((dueDate - today) / (1000*60*60*24));
    const alreadyBilled = db.invoices.find(i => i.tenantId === t.id && i.period === currentPeriod);
    const suffix      = payDay===1?'st':payDay===2?'nd':payDay===3?'rd':'th';
    return { t, room, rent, total, payDay, dueDate, dueDateStr, daysLeft, alreadyBilled, suffix };
  }).sort((a, b) => a.payDay - b.payDay);

  let invs = [...db.invoices];
  if (billingFilter !== 'all') invs = invs.filter(i => i.status === billingFilter);
  if (billSearch) invs = invs.filter(i => {
    const t = db.tenants.find(t => t.id === i.tenantId);
    return t && t.name.toLowerCase().includes(billSearch);
  });

  getBody().innerHTML = `<div class="fade-in">

    <!-- ══ STATS ══ -->
    <div class="grid-4" style="margin-bottom:18px;">
      <div class="stat-card sc-teal">

async function generateMonthlyBills() {
  const activeTenants = db.tenants.filter(t => t.status !== 'inactive');
  if (activeTenants.length === 0) { showToast('No active tenants to bill', 'warning'); return; }

  const btn = document.getElementById('gen-invoices');
  if (btn) { btn.disabled = true; btn.innerHTML = SVG.download + ' Generating...'; }

  const today  = new Date();
  const period = today.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

  try {
    const res = await api('billing', { action: 'generate_monthly', period });
    await syncDB();
    if (res.created > 0) {
      showToast(`✅ ${res.created} invoice${res.created > 1 ? 's' : ''} generated for ${period}!`, 'success');
    } else {
      showToast(`All ${res.skipped} tenants already billed for ${period}`, 'warning');
    }
    drawBilling();
    renderSidebar();
  } catch(e) {
    showToast(e.message, 'error');
  }
  if (btn) { btn.disabled = false; btn.innerHTML = SVG.download + ' Generate Monthly'; }
}

function newInvoiceModal() {
  const activeTenants = db.tenants.filter(t => t.status !== 'inactive');

  const today      = new Date();
  const defaultPeriod = today.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

          <label class="form-label">Status</label>
          <select class="form-select" id="inv-status">

        </div>

        <!-- Rent -->
        <div class="form-group">
          <label class="form-label">Rent (₱) *</label>
          <input class="form-input breakdown-field" id="inv-rent" type="number" min="0" placeholder="4500" value="4500"/>
        </div>
        <!-- Water -->

          <label class="form-label">Water (₱)</label>
          <input class="form-input breakdown-field" id="inv-water" type="number" min="0" placeholder="150" value="150"/>
        </div>
        <!-- Electricity -->
        <div class="form-group">
          <label class="form-label">Electricity (₱)</label>
          <input class="form-input breakdown-field" id="inv-elec" type="number" min="0" placeholder="150" value="150"/>

        <!-- Live total -->
        <div class="form-group" style="align-self:flex-end;">
          <label class="form-label">Total Amount</label>

    onConfirm: async ov => {
      const tenantId = ov.querySelector('#inv-t').value;
      const period   = ov.querySelector('#inv-period').value.trim();
      const dueDate  = ov.querySelector('#inv-due').value;
      const status   = ov.querySelector('#inv-status').value;
      const rent     = parseFloat(ov.querySelector('#inv-rent').value)  || 0;
      const water    = parseFloat(ov.querySelector('#inv-water').value) || 0;
      const elec     = parseFloat(ov.querySelector('#inv-elec').value)  || 0;
      const total    = rent + water + elec;

      if (!tenantId)   { showToast('Select a tenant', 'error'); return; }
      if (!period)     { showToast('Enter the billing period', 'error'); return; }
      if (!dueDate)    { showToast('Set a due date', 'error'); return; }

    const tenantSel = document.getElementById('inv-t');

    const waterInput= document.getElementById('inv-water');
    const elecInput = document.getElementById('inv-elec');
    const totalDisp = document.getElementById('inv-total-display');
    const dueInput  = document.getElementById('inv-due');

    function recalcTotal() {
      const t = (parseFloat(rentInput?.value) || 0)
              + (parseFloat(waterInput?.value) || 0)
              + (parseFloat(elecInput?.value)  || 0);
      if (totalDisp) totalDisp.textContent = fmtCur(t);

        const payDay= Math.min(t.payDay || 5, 28);
        dueInput.value = new Date(today.getFullYear(), today.getMonth(), payDay).toISOString().split('T')[0];
      }

      recalcTotal();
    });

    document.querySelectorAll('.breakdown-field').forEach(f => f.addEventListener('input', recalcTotal));
    recalcTotal();
  }, 50);
}

    confirmText: '✅ Confirm Payment',

      const method = ov.querySelector('#pay-method').value;
      const ref    = ov.querySelector('#pay-ref').value.trim() || 'N/A';
      const btn    = ov.querySelector('#mok');
      btn.disabled = true; btn.textContent = 'Processing...';
      try {
        await api('billing', { action: 'mark_paid', invoiceId: invId, method, reference: ref });
        // Notifications
        const uid = tenantUserId(t);
        await pushNotif({ title: 'Payment Received ✓', body: `${t?.name || 'Tenant'} paid ${fmtCur(inv.amount)} for ${inv.period} via ${method}. Ref: ${ref}`, type: 'payment', role: 'Landlord', route: '/billing' });

        ov.remove();
        showToast(`Payment of ${fmtCur(inv.amount)} recorded!`, 'success');
        drawBilling();
        renderSidebar();
      } catch(e) {
        showToast(e.message, 'error');
        btn.disabled = false; btn.textContent = '✅ Confirm Payment';
      }
    }
  });
}

          <div style="font-weight:700;font-size:14px;color:var(--dark);">${t?.name || '—'}</div>

// ── DELETE INVOICE ────────────────────────────────────────────
function deleteInvoiceConfirm(id) {
  const inv = db.invoices.find(i => i.id === id);
  openModal({
    title: 'Delete Invoice',
    body: `<div style="text-align:center;padding:12px 0;">
      <div style="display:flex;justify-content:center;margin-bottom:12px;opacity:.7;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></div>
      <p style="font-weight:700;color:var(--dark);font-size:14px;margin-bottom:8px;">Delete invoice <span style="color:var(--red);">${inv?.number || id}</span>?</p>
      <p style="color:var(--slate);font-size:12px;line-height:1.6;">If unpaid, the tenant's balance will be reduced accordingly.<br>Paid invoices cannot be deleted.</p>
    </div>`,
    confirmText: 'Delete', confirmClass: 'btn-danger',
    onConfirm: async ov => {
      if (inv?.status === 'paid') { showToast('Paid invoices cannot be deleted', 'error'); return; }
      try {
        await api('billing', { action: 'delete_invoice', id });
        await syncDB(); ov.remove();
        showToast('Invoice deleted', 'warning');
        drawBilling(); renderSidebar();
      } catch(e) { showToast(e.message, 'error'); }
    }
  });
}

// ── TENANT: PAY INVOICE ───────────────────────────────────────
function tenantPayInvoice(invId) {
  const inv = db.invoices.find(i => i.id === invId);
  if (!inv) return;
  const bd = inv.breakdown || {};
  const hasBreakdown = bd.rent !== undefined;

  openModal({
    title: `Pay — ${inv.number || inv.period}`,
    body: `
      <div class="invoice-preview" style="margin-bottom:16px;">
        <div style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--slate);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">${inv.period}</div>
        ${hasBreakdown ? `
          <div class="inv-line"><span>Rent</span><span>${fmtCur(bd.rent || 0)}</span></div>
          <div class="inv-line"><span>Water</span><span>${fmtCur(bd.water || 0)}</span></div>
          <div class="inv-line"><span>Electricity</span><span>${fmtCur(bd.electricity || 0)}</span></div>` :
        `<div class="inv-line"><span>${inv.label || inv.period}</span><span>${fmtCur(inv.amount)}</span></div>`}
        <div class="inv-line total"><span>Total Due</span><span style="color:var(--teal);font-size:16px;">${fmtCur(inv.amount)}</span></div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select class="form-select" id="pay-method">
            <option>GCash</option>
            <option>Bank Transfer</option>
            <option>Cash</option>
            <option>PayMaya</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Reference Number</label>
          <input class="form-input" id="pay-ref" placeholder="e.g. GC-1234567"/>
        </div>
      </div>
    `,
    confirmText: '✅ Confirm Payment',
    onConfirm: async ov => {
      const method = ov.querySelector('#pay-method').value;
      const ref    = ov.querySelector('#pay-ref').value.trim() || 'N/A';
      const btn    = ov.querySelector('#mok');
      btn.disabled = true; btn.textContent = 'Processing...';
      try {
        await api('billing', { action: 'mark_paid', invoiceId: invId, method, reference: ref });
        await syncDB();
        ov.remove();
        showToast(`Payment of ${fmtCur(inv.amount)} submitted!`, 'success');
        // Refresh whichever page is open
        if (currentPage === '/my-invoices') pageMyInvoices();
        else pageDashboardTenant();
      } catch(e) {
        showToast(e.message, 'error');
        btn.disabled = false; btn.textContent = '✅ Confirm Payment';
      }
    }
  });
}
