                    ${tenantList.length > 0 ? `
                      <div style="background:var(--navy-light);border-radius:6px;padding:8px 10px;margin-bottom:14px;font-size:11px;color:var(--slate);">
                        <span style="font-weight:600;color:var(--dark);">Current roommates:</span> ${tenantList.join(', ')}
                      </div>` : ''}
                    <!-- Book button -->
                    <button class="btn btn-primary" style="width:100%;justify-content:center;" data-book="${room.id}">
                      ✅ Choose This Room
                    </button>
                  </div>
                </div>`;
              }).join('')}
            </div>`}
      </div>`;

      // Wire filter tabs
      document.querySelectorAll('[data-rbf]').forEach(b => b.addEventListener('click', () => {
        roomBrowseFilter = b.dataset.rbf;
        renderRoomBrowser();
      }));

      // Search
      document.getElementById('room-browse-search')?.addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.room-browse-card').forEach(card => {
          const rid  = card.dataset.rid;
          const room = db.rooms.find(r => r.id === rid);
          card.style.display = room && (room.number.toLowerCase().includes(q) || room.type.toLowerCase().includes(q)) ? '' : 'none';
        });
      });

      // Hover effects
      document.querySelectorAll('.room-browse-card').forEach(card => {
        card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-3px)'; card.style.boxShadow = '0 8px 28px rgba(0,229,160,0.12)'; card.style.borderColor = 'rgba(0,229,160,0.3)'; });
        card.addEventListener('mouseleave', () => { card.style.transform = ''; card.style.boxShadow = ''; card.style.borderColor = ''; });
      });

      // Book button — confirm and assign
      document.querySelectorAll('[data-book]').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const roomId = btn.dataset.book;
          const room   = db.rooms.find(r => r.id === roomId);
          if (!room) return;
          openModal({
            title: 'Confirm Room Selection',
            body: `<div style="text-align:center;padding:10px 0;">
              <div style="display:flex;justify-content:center;margin-bottom:12px;opacity:.7;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
              <div style="font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--dark);margin-bottom:6px;">Room ${room.number}</div>
              <div class="text-sm" style="margin-bottom:4px;">${room.type} · Floor ${room.floor}</div>
              <div style="font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--teal);margin-bottom:16px;">${fmtCur(room.price)}/month</div>
              <div style="background:var(--teal-pale);border:1px solid rgba(0,229,160,0.2);border-radius:8px;padding:12px 16px;margin-bottom:8px;font-size:13px;color:var(--dark);text-align:left;">
                <div style="font-weight:700;margin-bottom:6px;color:var(--teal);">What happens next:</div>
                <div style="color:var(--slate);line-height:1.8;">
                  ✅ You will be moved into Room ${room.number}<br>
                  ✅ Your monthly rent will be ${fmtCur(room.price)}<br>
                  ✅ Bills will be auto-generated each month
                </div>
              </div>
            </div>`,
            confirmText: '✅ Confirm — Move In',
            onConfirm: async ov => {
              const btn2 = ov.querySelector('#mok');
              btn2.disabled = true; btn2.textContent = 'Booking...';
              try {
                await api('tenants', { action: 'assign_room', tenantId: tenant.id, roomId });
                await syncDB();
                ov.remove();
                showToast('Welcome to Room ' + room.number + '!', 'success');
                // Notify landlord
                await pushNotif({
                  title: 'Room Selected',
                  body: tenant.name + ' has selected Room ' + room.number + '. Please review their booking.',
                  type: 'room', role: 'Landlord', route: '/tenants'
                });
                pageMyRoom();
              } catch(e) {
                showToast(e.message, 'error');
                btn2.disabled = false; btn2.textContent = '✅ Confirm — Move In';
              }
            }
          });
        });
      });
    }

    renderRoomBrowser();
  }
}

var maintFilter='all';
function pageMaintenance(){
  maintFilter='all';buildShell();
  const isTenant=db.currentUser.role==='Tenant';
  // Only tenants submit requests — landlords & admin view and manage only
  setTopbar('Maintenance', isTenant ? `<button class="btn btn-primary" id="btn-new-ticket">+ Submit Request</button>` : '');
  drawMaint();
  document.getElementById('btn-new-ticket')?.addEventListener('click', () => newTicketModalTenant());
}

function drawMaint(){
  const role=db.currentUser.role;const isTenant=role==='Tenant';
  const allItems=isTenant?db.maintenance.filter(m=>m.tenantId===db.currentUser.tenantId):db.maintenance;
  const counts={all:allItems.length,open:allItems.filter(m=>m.status==='open').length,'in-progress':allItems.filter(m=>m.status==='in-progress').length,resolved:allItems.filter(m=>m.status==='resolved').length};
  const items=maintFilter==='all'?allItems:allItems.filter(m=>m.status===maintFilter);
  getBody().innerHTML=`<div class="fade-in"><div class="grid-4" style="margin-bottom:18px;"><div class="stat-card sc-red" style="cursor:pointer;" data-filter="open"><div class="stat-icon si-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></div><div class="stat-label">Open</div><div class="stat-value">${counts.open}</div><div class="stat-sub">Needs attention</div></div><div class="stat-card sc-amber" style="cursor:pointer;" data-filter="in-progress"><div class="stat-icon si-amber"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div class="stat-label">In Progress</div><div class="stat-value">${counts['in-progress']}</div></div><div class="stat-card sc-green" style="cursor:pointer;" data-filter="resolved"><div class="stat-icon si-green">${SVG.check}</div><div class="stat-label">Resolved</div><div class="stat-value">${counts.resolved}</div></div><div class="stat-card sc-blue" style="cursor:pointer;" data-filter="all"><div class="stat-label">Total</div><div class="stat-value">${counts.all}</div></div></div>
  <div class="flex-between" style="margin-bottom:14px;"><div class="filter-tabs">${[['all','All'],['open','Open'],['in-progress','In Progress'],['resolved','Resolved']].map(([v,l])=>`<button class="filter-tab ${maintFilter===v?'active':''}" data-f="${v}">${l} (${counts[v]||0})</button>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:12px;">${items.length===0?`<div class="empty-state"><p>No maintenance requests found.</p></div>`:items.map(m=>{const tenant=db.tenants.find(t=>t.id===m.tenantId);const room=db.rooms.find(r=>r.id===m.roomId);return`<div class="ticket"><div class="pbar p-${m.priority}"></div><div style="flex:1;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div style="font-weight:700;font-size:14px;color:var(--dark);">${m.title}</div>${badge(m.status)}<span class="badge badge-${m.priority==='high'?'red':m.priority==='medium'?'amber':'green'}">${m.priority}</span></div><div class="text-xs" style="margin-bottom:6px;">Room ${room?.number||'?'} · ${m.category} · ${fmtDate(m.createdAt)} · ${tenant?.name||'Unknown'}</div><div class="text-sm" style="color:var(--slate);">${m.description||''}</div></div><div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">${!isTenant&&m.status!=='resolved'?`<button class="btn btn-primary btn-sm maint-stat-btn" data-id="${m.id}" data-status="${m.status==='open'?'in-progress':'resolved'}">${m.status==='open'?'Start':'Resolve'}</button>`:''}<button class="btn btn-danger btn-sm del-maint-btn" data-id="${m.id}">✕</button></div></div>`;}).join('')}</div></div>`;
  document.querySelectorAll('[data-filter]').forEach(c=>c.addEventListener('click',()=>{maintFilter=c.dataset.filter;drawMaint();}));
  document.querySelectorAll('.filter-tab').forEach(t=>t.addEventListener('click',()=>{maintFilter=t.dataset.f;drawMaint();}));
  document.querySelectorAll('.maint-stat-btn').forEach(b=>b.addEventListener('click',async()=>{
    try{await api('maintenance',{action:'update_status',id:b.dataset.id,status:b.dataset.status});await syncDB();showToast('Status updated!','success');drawMaint();renderSidebar();}catch(e){showToast(e.message,'error');}
  }));
  document.querySelectorAll('.del-maint-btn').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Delete this ticket?'))return;
    try{await api('maintenance',{action:'delete',id:b.dataset.id});await syncDB();showToast('Deleted','warning');drawMaint();}catch(e){showToast(e.message,'error');}
  }));
}

function newTicketModalLandlord(){
  openModal({title:'New Maintenance Request',body:`<div class="form-grid"><div class="form-group form-full"><label class="form-label">Issue Title *</label><input class="form-input" id="maint-title" placeholder="e.g. Leaking faucet"/></div><div class="form-group"><label class="form-label">Tenant *</label><select class="form-select" id="maint-tenant"><option value="">Select tenant</option>${db.tenants.map(t=>{const r=db.rooms.find(r=>r.id===t.roomId);return`<option value="${t.id}" data-room="${t.roomId||''}">${t.name}${r?' — Room '+r.number:''}</option>`;}).join('')}</select></div><div class="form-group"><label class="form-label">Room *</label><select class="form-select" id="maint-room"><option value="">Select room</option>${db.rooms.map(r=>`<option value="${r.id}">Room ${r.number} — ${r.type}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Category</label><select class="form-select" id="maint-cat"><option>Plumbing</option><option>Electrical</option><option>HVAC</option><option>Carpentry</option><option>Appliance</option><option>General</option></select></div><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="maint-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div class="form-group form-full"><label class="form-label">Description</label><textarea class="form-textarea" id="maint-desc" placeholder="Describe the issue..."></textarea></div></div>`,confirmText:'Submit Request',

function newTicketModalTenant(){
  const tenant=db.tenants.find(t=>t.id===db.currentUser.tenantId);

  if(!tenant||!room){showToast('No room assigned to your account','error');return;}
  openModal({title:'Submit Maintenance Request',body:`<div style="display:flex;align-items:center;gap:10px;background:rgba(0,229,160,0.06);border:1px solid rgba(0,229,160,0.2);border-radius:8px;padding:10px 14px;margin-bottom:16px;">${SVG.home}<div><div style="font-weight:600;font-size:13px;color:var(--dark);">Room ${room.number} — ${room.type}</div><div class="text-xs">Your request will be sent to the landlord.</div></div></div><div class="form-grid"><div class="form-group form-full"><label class="form-label">Issue Title *</label><input class="form-input" id="maint-title" placeholder="e.g. Leaking faucet"/></div><div class="form-group"><label class="form-label">Category</label><select class="form-select" id="maint-cat"><option>Plumbing</option><option>Electrical</option><option>HVAC</option><option>Carpentry</option><option>Appliance</option><option>General</option></select></div><div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="maint-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High — urgent!</option></select></div><div class="form-group form-full"><label class="form-label">Description *</label><textarea class="form-textarea" id="maint-desc" placeholder="Please describe the issue..." style="min-height:100px;"></textarea></div></div>`,confirmText:'Submit Request',
  onConfirm:async ov=>{
    const title=ov.querySelector('#maint-title').value.trim();const desc=ov.querySelector('#maint-desc').value.trim();
    if(!title){showToast('Enter a title','error');return;}if(!desc){showToast('Describe the issue','error');return;}
    try{
      await api('maintenance',{action:'add',tenantId:db.currentUser.tenantId,roomId:room.id,title,description:desc,category:ov.querySelector('#maint-cat').value,priority:ov.querySelector('#maint-priority').value});

    }catch(e){showToast(e.message,'error');}
  }});
}

function pageReports(){
  buildShell();setTopbar('Reports & Analytics',`<button class="btn btn-ghost" id="rpt-export">${SVG.download} Export CSV</button>`);
  const s=stats();
  const totalRevenue=db.payments.reduce((sum,p)=>sum+p.amount,0);
  const paidInvoices=db.invoices.filter(i=>i.status==='paid').length;
  const totalInvoices=db.invoices.length;
  const collectionRate=totalInvoices>0?Math.round((paidInvoices/totalInvoices)*100):0;
  const totalOutstanding=db.invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.amount,0);
  const occupancyRate=db.rooms.length>0?Math.round((db.rooms.filter(r=>r.status==='occupied').length/db.rooms.length)*100):0;
  const maxRev=Math.max(...db.monthlyRevenue.map(m=>m.amount),1);
  setTimeout(()=>{
    document.getElementById('rpt-export')?.addEventListener('click',()=>{
      const rows=[['Invoice #','Tenant','Period','Amount','Due Date','Status','Paid Date','Method']];
      db.invoices.forEach(inv=>{const t=db.tenants.find(x=>x.id===inv.tenantId);const pmt=db.payments.find(p=>p.invoiceId===inv.id);rows.push([inv.number,t?.name||'—',inv.period,inv.amount,inv.dueDate,inv.status,inv.paidDate||'—',pmt?.method||'—']);});
      const csv='data:text/csv;charset=utf-8,'+rows.map(r=>r.join(',')).join('\n');
      const a=document.createElement('a');a.href=encodeURI(csv);a.download='billing-report.csv';a.click();
      showToast('CSV exported!','success');
    });
  },0);
  getBody().innerHTML=`<div class="fade-in"><div class="grid-4" style="margin-bottom:18px;"><div class="stat-card sc-teal"><div class="stat-label">Total Collected</div><div class="stat-value">${fmtCur(totalRevenue)}</div><div class="stat-trend-up">${paidInvoices} paid invoices</div></div><div class="stat-card sc-red"><div class="stat-label">Outstanding</div><div class="stat-value" style="color:var(--red);">${fmtCur(totalOutstanding)}</div><div class="stat-sub">${totalInvoices-paidInvoices} unpaid</div></div><div class="stat-card sc-amber"><div class="stat-label">Collection Rate</div><div class="stat-value">${collectionRate}%</div><div class="stat-trend-up">${paidInvoices}/${totalInvoices} paid</div></div><div class="stat-card sc-blue"><div class="stat-label">Occupancy</div><div class="stat-value">${occupancyRate}%</div><div class="stat-sub">${db.rooms.filter(r=>r.status==='occupied').length}/${db.rooms.length} rooms</div></div></div><div class="grid-2" style="margin-bottom:18px;"><div class="card"><div class="card-header"><div class="card-title">Monthly Revenue</div></div><div class="card-body">${db.monthlyRevenue.length===0?`<div class="empty-state" style="padding:40px;"><p>No revenue data yet.</p></div>`:`<div class="bar-chart" style="height:140px;">${db.monthlyRevenue.map((m,i)=>{const pct=Math.max(Math.round(m.amount/maxRev*95),2);return`<div class="bar-wrap"><div class="bar-val">${m.amount>0?'₱'+Math.round(m.amount/1000)+'k':'—'}</div><div class="bar ${i===db.monthlyRevenue.length-1?'highlight':''}" style="height:${pct}%;"></div><span class="bar-x">${m.month}</span></div>`;}).join('')}</div>`}</div></div><div class="card"><div class="card-header"><div class="card-title">Occupancy Trend</div></div><div class="card-body">${db.occupancyHistory.length===0?`<div class="empty-state" style="padding:40px;"><p>No history yet.</p></div>`:`<div class="bar-chart" style="height:140px;">${db.occupancyHistory.map((m,i)=>`<div class="bar-wrap"><div class="bar-val">${m.rate}%</div><div class="bar ${i===db.occupancyHistory.length-1?'highlight':''}" style="height:${Math.max(m.rate,2)}%;"></div><span class="bar-x">${m.month}</span></div>`).join('')}</div>`}</div></div></div><div class="card" style="margin-bottom:18px;"><div class="card-header"><div class="card-title">Bill Payment Report</div><span style="margin-left:auto;font-size:11px;color:var(--slate);">${db.invoices.length} total</span></div>${db.invoices.length===0?`<div class="empty-state" style="padding:40px;"><p>No data yet.</p></div>`:`<div class="table-wrap"><table><thead><tr><th>Tenant</th><th>Invoice #</th><th>Period</th><th>Rent</th><th>Water</th><th>Electricity</th><th>Total</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>${db.invoices.map(inv=>{const t=db.tenants.find(x=>x.id===inv.tenantId);const bd=inv.breakdown||{};const pmt=db.payments.find(p=>p.invoiceId===inv.id);return t?`<tr><td><div style="display:flex;align-items:center;gap:7px;">${av(t.name)}<span style="font-weight:600;font-size:12px;">${t.name}</span></div></td><td class="td-mono" style="font-size:11px;">${inv.number}</td><td class="text-sm">${inv.period}</td><td class="text-sm">${fmtCur(bd.rent||0)}</td><td class="text-sm">${fmtCur(bd.water||0)}</td><td class="text-sm">${fmtCur(bd.electricity||0)}</td><td style="font-weight:700;">${fmtCur(inv.amount)}</td><td class="text-sm" style="color:${inv.status==='overdue'?'var(--red)':'inherit'};">${fmtDate(inv.dueDate)}</td><td class="text-sm" style="color:var(--teal);">${inv.paidDate?fmtDate(inv.paidDate):'—'}</td><td>${badge(inv.status)}</td></tr>`:'';}).join('')}</tbody></table></div>`}</div></div>`;
}

function pageAnnouncements() {
  buildShell();
  const role    = db.currentUser.role;

  const canPost = role !== 'Tenant';

  if (isAdmin) {
    setTopbar('Announcements',
      `<button class="btn btn-ghost" id="ann-filter-all">All</button>
       <button class="btn btn-ghost" id="ann-filter-mine">My Posts</button>
       <button class="btn btn-primary" id="new-ann">Post Announcement</button>`
    );
  } else if (canPost) {
    setTopbar('Announcements', `<button class="btn btn-primary" id="new-ann">Post Announcement</button>`);
  } else {
    setTopbar('Announcements');
  }

  drawAnn();
  document.getElementById('new-ann')?.addEventListener('click', newAnnModal);

  // Admin filter buttons
  let annViewFilter = 'all';
  document.getElementById('ann-filter-all')?.addEventListener('click', () => {
    annViewFilter = 'all';
    document.getElementById('ann-filter-all').className = 'btn btn-primary';
    document.getElementById('ann-filter-mine').className = 'btn btn-ghost';
    drawAnn('all');
  });
  document.getElementById('ann-filter-mine')?.addEventListener('click', () => {

    document.getElementById('ann-filter-all').className = 'btn btn-ghost';
    document.getElementById('ann-filter-mine').className = 'btn btn-primary';
    drawAnn('mine');

}

function drawAnn(filter) {
  if (filter === undefined) filter = 'all';
  const role    = db.currentUser.role;
  const isAdmin = role === 'System Admin';
  const canPost = role !== 'Tenant';

  // Filter announcements visible to current user
  let anns = db.announcements.filter(a => {
    if (!a.targetRole || a.targetRole === 'all') return true;
    if (a.targetRole === role) return true;
    // Admin sees everything
    if (isAdmin) return true;
    return false;
  });

  // Admin "my posts" filter
  if (filter === 'mine') {
    anns = anns.filter(a => a.author === db.currentUser.name);
  }

  // Sort: pinned first, then by date desc
  anns.sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  const typeConfig = {
    info:      { icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,  color: 'var(--blue)',   bg: 'rgba(88,166,255,0.08)',  border: 'rgba(88,166,255,0.25)',  label: 'Info'       },
    warning:   { icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,  color: 'var(--amber)',  bg: 'rgba(240,180,41,0.08)',  border: 'rgba(240,180,41,0.25)', label: 'Warning'    },
    urgent:    { icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3z"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,  color: 'var(--red)',    bg: 'rgba(255,76,106,0.08)',  border: 'rgba(255,76,106,0.3)',  label: 'Urgent'     },

  getBody().innerHTML = `<div class="fade-in">

      <div class="stat-card sc-purple">
        <div class="stat-icon si-purple"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></div>

        <div class="stat-icon si-teal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
        <div class="stat-label">Public</div>
        <div class="stat-value">${db.announcements.filter(a=>!a.targetRole||a.targetRole==='all').length}</div>

      <div class="stat-card sc-amber">
        <div class="stat-icon si-amber"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3z"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
        <div class="stat-label">Urgent</div>
        <div class="stat-value">${db.announcements.filter(a=>a.type==='urgent').length}</div>
        <div class="stat-sub">High priority</div>
      </div>
    </div>` : ''}

    <!-- Announcement feed -->
    <div style="max-width:760px;">
      ${anns.length === 0 ? `
        <div class="empty-state" style="padding:70px 20px;">
          <div class="empty-icon" style="display:flex;justify-content:center;margin-bottom:12px;opacity:.5;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l16-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
          <p style="font-weight:700;font-size:15px;color:var(--dark);margin-bottom:8px;">No announcements yet</p>
          <p class="text-xs" style="margin-bottom:18px;">
            ${canPost ? 'Post an announcement to notify everyone.' : 'The landlord or admin will post announcements here.'}
          </p>
          ${canPost ? `<button class="btn btn-primary" id="empty-post-btn">Post First Announcement</button>` : ''}
        </div>` :

        anns.map(a => {
          const cfg  = typeConfig[a.type] || typeConfig.info;
          const isPinned = a.pinned;
          const isOwner  = canPost && (isAdmin || a.author === db.currentUser.name);
          return `
          <div class="card ann-card" style="margin-bottom:14px;border-color:${cfg.border};${isPinned ? 'border-width:2px;' : ''}position:relative;" data-id="${a.id}">
            ${isPinned ? `<div style="position:absolute;top:-1px;right:16px;background:var(--red);color:#fff;font-size:9px;font-weight:700;font-family:var(--font-mono);padding:2px 8px;border-radius:0 0 6px 6px;letter-spacing:.5px;" style="display:inline-flex;align-items:center;gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> PINNED</div>` : ''}

            <!-- Card header -->
            <div class="card-header" style="background:${cfg.bg};border-bottom-color:${cfg.border};">
              <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
                <span style="font-size:20px;flex-shrink:0;">${cfg.icon}</span>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;">
                    <div class="card-title" style="color:${cfg.color};">${a.title}</div>
                    <span style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.border};font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;letter-spacing:.5px;text-transform:uppercase;">${cfg.label}</span>
                    ${a.targetRole && a.targetRole !== 'all' ? `<span style="background:var(--navy-light);color:var(--slate);font-family:var(--font-mono);font-size:9px;padding:2px 7px;border-radius:100px;border:1px solid var(--border);">${targetLabel(a.targetRole)}</span>` : `<span style="background:rgba(0,229,160,0.1);color:var(--teal);font-family:var(--font-mono);font-size:9px;padding:2px 7px;border-radius:100px;border:1px solid rgba(0,229,160,0.2);">Everyone</span>`}
                  </div>
                  <div class="text-xs">Posted by <strong style="color:var(--dark);">${a.author}</strong> · ${fmtDate(a.createdAt)}</div>
                </div>
              </div>

              <!-- Action buttons -->
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:12px;">
                ${isOwner ? `
                  <button class="btn btn-ghost btn-sm ann-pin-btn" data-id="${a.id}" title="${isPinned ? 'Unpin' : 'Pin to top'}" >${isPinned ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>` : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 9-9c2.39 0 4.68.94 6.36 2.64"/><circle cx="12" cy="10" r="3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`}</button>
                  <button class="btn btn-ghost btn-sm ann-edit-btn" data-id="${a.id}">Edit</button>
                  <button class="btn btn-danger btn-sm ann-del-btn" data-id="${a.id}">Delete</button>
                ` : ''}
              </div>
            </div>

            <!-- Body -->
            <div class="card-body">
              <p style="font-size:13.5px;color:var(--slate);line-height:1.7;white-space:pre-line;">${a.body}</p>
            </div>
          </div>`;
        }).join('')}
    </div>
  </div>`;

  // Wire empty state post button
  document.getElementById('empty-post-btn')?.addEventListener('click', newAnnModal);

  // Wire action buttons
  document.querySelectorAll('.ann-del-btn').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    const id = b.dataset.id;
    const ann = db.announcements.find(a => a.id === id);
    openModal({
      title: 'Delete Announcement',
      body: `<div style="text-align:center;padding:14px 0;">
        <div style="display:flex;justify-content:center;margin-bottom:12px;opacity:.7;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></div>
        <p style="font-weight:700;font-size:14px;color:var(--dark);margin-bottom:8px;">Delete this announcement?</p>
        <p style="color:var(--slate);font-size:13px;">"${ann?.title}"</p>
      </div>`,
      confirmText: 'Delete', confirmClass: 'btn-danger',
      onConfirm: async ov => {
        try {
          await api('announcements', { action: 'delete', id });
          await syncDB(); ov.remove();
          showToast('Announcement deleted', 'warning');
          drawAnn(filter);
        } catch(e) { showToast(e.message, 'error'); }
      }
    });
  }));

  document.querySelectorAll('.ann-edit-btn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    editAnnModal(b.dataset.id, filter);
  }));

  document.querySelectorAll('.ann-pin-btn').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    const id  = b.dataset.id;
    const ann = db.announcements.find(a => a.id === id);
    if (!ann) return;
    const newPinned = !ann.pinned;
    try {
      await api('announcements', { action: 'edit', id, title: ann.title, body: ann.body, type: ann.type, targetRole: ann.targetRole, pinned: newPinned });
      await syncDB();
      showToast(newPinned ? 'Pinned to top!' : 'Unpinned', 'success');
      drawAnn(filter);
    } catch(e) { showToast(e.message, 'error'); }
  }));
}

// ── POST NEW ANNOUNCEMENT modal ───────────────────────────────
function newAnnModal() {
  const isAdmin    = db.currentUser.role === 'System Admin';
  const isLandlord = db.currentUser.role === 'Landlord';

  openModal({
    title: isAdmin ? 'Post Public Announcement' : 'Post Announcement',
    body: `
      <div style="display:flex;flex-direction:column;gap:14px;">

        ${isAdmin ? `
        <!-- Admin: audience targeting -->
        <div style="background:rgba(210,168,255,0.08);border:1px solid rgba(210,168,255,0.2);border-radius:8px;padding:12px 16px;">
          <div style="font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;" style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:inline-block;"><path d="M3 11l16-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg> Broadcast Settings</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Target Audience</label>
              <select class="form-select" id="ann-target">
                <option value="all">Everyone (Public)</option>
                <option value="Tenant">Tenants Only</option>
                <option value="Landlord">Landlords Only</option>
                <option value="System Admin">Admins Only</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Type</label>
              <div id="ann-type-group" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
                ${[['notice','Notice','var(--teal)','var(--teal-light)'],['info','Information','var(--blue)','var(--blue-light)'],['warning','Warning','var(--amber)','var(--amber-light)'],['urgent','Urgent','var(--red)','var(--red-light)'],['event','Event','var(--purple)','var(--purple-light)'],['maintenance','Maintenance','var(--amber)','var(--amber-light)']].map(function(item){var v=item[0],l=item[1];return '<button type="button" class="ann-type-btn" data-val="'+v+'" style="padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--slate);font-size:11px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:all .15s;text-align:center;">'+l+'</button>';}).join('')}
              </div>
              <input type="hidden" id="ann-type" value="notice"/>
            </div>
          </div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dark);">
              <input type="checkbox" id="ann-pin" style="accent-color:var(--teal);width:15px;height:15px;"/> 
              <span>Pin this announcement (always shown at top)</span>
            </label>
          </div>
        </div>` : `
        <!-- Landlord: simpler options -->
        <div class="form-group">
          <label class="form-label">Type</label>
          <div id="ann-type-group" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            ${[['notice','Notice','var(--teal)','var(--teal-light)'],['info','Information','var(--blue)','var(--blue-light)'],['warning','Warning','var(--amber)','var(--amber-light)'],['urgent','Urgent','var(--red)','var(--red-light)'],['event','Event','var(--purple)','var(--purple-light)'],['maintenance','Maintenance','var(--amber)','var(--amber-light)']].map(function(item){var v=item[0],l=item[1];return '<button type="button" class="ann-type-btn" data-val="'+v+'" style="padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--slate);font-size:11px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:all .15s;text-align:center;">'+l+'</button>';}).join('')}
          </div>
          <input type="hidden" id="ann-type" value="notice"/>
        </div>`}

        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-input" id="ann-title" placeholder="Announcement title..."/>
        </div>

        <div class="form-group">
          <label class="form-label">Message *</label>
          <textarea class="form-textarea" id="ann-body" placeholder="Write your announcement in full detail..." style="min-height:120px;"></textarea>
        </div>

        <!-- Live preview -->
        <div style="background:var(--navy-light);border:1px solid var(--border);border-radius:8px;padding:12px 16px;">
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--slate-light);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Preview</div>
          <div id="ann-preview" style="font-size:12px;color:var(--slate);font-style:italic;">Start typing to preview...</div>
        </div>
      </div>
    `,
    confirmText: isAdmin ? 'Broadcast Now' : 'Post Announcement',
    onConfirm: async ov => {
      const title      = ov.querySelector('#ann-title').value.trim();
      const body       = ov.querySelector('#ann-body').value.trim();
      const type       = ov.querySelector('#ann-type')?.value || 'info';
      const targetRole = ov.querySelector('#ann-target')?.value || 'all';
      const pinned     = ov.querySelector('#ann-pin')?.checked || false;

      if (!title) { showToast('Enter a title', 'error'); return; }
      if (!body)  { showToast('Write the announcement', 'error'); return; }

      const btn = ov.querySelector('#mok');
      btn.disabled = true; btn.textContent = 'Posting...';

      try {
        await api('announcements', {
          action: 'add', title, body, type,
          author: db.currentUser.name,
          targetRole, pinned,
        });

        // Notify target audience
        const notifRoles = targetRole === 'all'
          ? ['Landlord', 'Tenant', 'System Admin']
          : [targetRole];

        for (const r of notifRoles) {
          await pushNotif({
            title: `${title}`,
            body: body.slice(0, 80) + (body.length > 80 ? '...' : ''),
            type: 'announcement',
            role: r,
            route: '/announcements'
          });
        }

        await syncDB();
        ov.remove();
        showToast('Announcement posted!', 'success');
        drawAnn();
      } catch(e) {
        showToast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = isAdmin ? 'Broadcast Now' : 'Post Announcement';
      }
    }
  });

  // Live preview + type button group wiring
  setTimeout(() => {
    const titleEl = document.getElementById('ann-title');
    const bodyEl  = document.getElementById('ann-body');
    const preview = document.getElementById('ann-preview');
    const typeInput = document.getElementById('ann-type');

    // Wire type button group
    document.querySelectorAll('.ann-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Deselect all
        document.querySelectorAll('.ann-type-btn').forEach(b => {
          b.style.background = 'transparent';
          b.style.color = 'var(--slate)';
          b.style.borderColor = 'var(--border)';
        });
        // Select clicked
        btn.style.background = 'var(--teal-light)';
        btn.style.color = 'var(--teal)';
        btn.style.borderColor = 'rgba(0,229,160,0.4)';
        if (typeInput) typeInput.value = btn.dataset.val;
      });
    });
    // Set initial active state
    const initType = typeInput?.value || 'notice';
    document.querySelectorAll('.ann-type-btn').forEach(btn => {
      if (btn.dataset.val === initType) {
        btn.style.background = 'var(--teal-light)';
        btn.style.color = 'var(--teal)';
        btn.style.borderColor = 'rgba(0,229,160,0.4)';
      }
    });

    function updatePreview() {
      const t = titleEl?.value || '';
      const b = bodyEl?.value || '';
      if (!t && !b) { if(preview) preview.innerHTML = '<em>Start typing to preview...</em>'; return; }
      if (preview) preview.innerHTML = `<strong style="color:var(--dark);">${t}</strong>${b ? '<br><span>' + b.slice(0,100) + (b.length>100?'...':'') + '</span>' : ''}`;
    }
    titleEl?.addEventListener('input', updatePreview);
    bodyEl?.addEventListener('input',  updatePreview);
  }, 50);
}

// ── EDIT ANNOUNCEMENT modal ───────────────────────────────────
function editAnnModal(id, filter) {
  const a = db.announcements.find(a => a.id === id);
  if (!a) return;
  const isAdmin = db.currentUser.role === 'System Admin';

  openModal({
    title: 'Edit Announcement',
    body: `
      <div style="display:flex;flex-direction:column;gap:14px;">
        ${isAdmin ? `
        <div class="form-grid">

            </div>
            <input type="hidden" id="ann-type" value="\${a.type}"/>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dark);">
            <input type="checkbox" id="ann-pin" style="accent-color:var(--teal);width:15px;height:15px;" ${a.pinned?'checked':''}/> 
            <span>Pin this announcement</span>
          </label>
        </div>` : `
        <div class="form-group">
          <label class="form-label">Type</label>
          <div id="ann-type-group" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            ${[['notice','Notice'],['info','Information'],['warning','Warning'],['urgent','Urgent'],['event','Event'],['maintenance','Maintenance']].map(function(item){var v=item[0],l=item[1];var sel=a.type===v;return '<button type="button" class="ann-type-btn" data-val="'+v+'" style="padding:7px 10px;border-radius:var(--radius-sm);border:1px solid '+(sel?'rgba(0,229,160,0.4)':'var(--border)')+';background:'+(sel?'var(--teal-light)':'transparent')+';color:'+(sel?'var(--teal)':'var(--slate)')+';font-size:11px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:all .15s;text-align:center;">'+l+'</button>';}).join('')}
          </div>
          <input type="hidden" id="ann-type" value="\${a.type}"/>
        </div>`}
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-input" id="ann-title" value="${a.title.replace(/"/g,'&quot;')}"/>
        </div>
        <div class="form-group">
          <label class="form-label">Message *</label>
          <textarea class="form-textarea" id="ann-body" style="min-height:120px;">${a.body}</textarea>
        </div>
      </div>
    `,
    confirmText: 'Save Changes',
    onConfirm: async ov => {
      const title      = ov.querySelector('#ann-title').value.trim();
      const body       = ov.querySelector('#ann-body').value.trim();
      const type       = ov.querySelector('#ann-type')?.value || a.type;
      const targetRole = ov.querySelector('#ann-target')?.value || a.targetRole;
      const pinned     = ov.querySelector('#ann-pin')?.checked ?? a.pinned;

      if (!title || !body) { showToast('Fill all fields', 'error'); return; }
      const btn = ov.querySelector('#mok');
      btn.disabled = true; btn.textContent = 'Saving...';

      try {
        await api('announcements', { action: 'edit', id, title, body, type, targetRole, pinned });
        await syncDB();
        ov.remove();
        showToast('Announcement updated!', 'success');
        drawAnn(filter);
      } catch(e) {
        showToast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Save Changes';
      }
    }
  });
}

async function adminToggleLandlord(id){

  openModal({title:isSuspending?'Suspend Landlord':'Activate Landlord',body:`<div style="text-align:center;padding:12px 0;"><div style="display:flex;justify-content:center;margin-bottom:12px;opacity:.7;">${isSuspending?`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`:`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`}</div><p style="font-weight:700;color:var(--dark);font-size:14px;margin-bottom:10px;">${isSuspending?'Suspend':'Activate'} <span style="color:${isSuspending?'var(--red)':'var(--teal)'};">${l.name}</span>?</p><p style="color:var(--slate);font-size:12px;line-height:1.7;">${isSuspending?'Their login will be blocked immediately.':'They will be able to log in again.'}</p></div>`,confirmText:isSuspending?'Yes, Suspend':'Yes, Activate',confirmClass:isSuspending?'btn-danger':'btn-primary',

}

var settingsTab='profile';

function drawSettings(body){
  const role=db.currentUser.role;const u=db.currentUser;
  let tabs=[{id:'profile',label:'Profile'},{id:'security',label:'Security'}];
  if(role==='Landlord'){tabs.splice(1,0,{id:'house',label:'House Info'},{id:'notifications',label:'Notifications'});}
  if(role==='System Admin'){tabs.push({id:'users',label:'Users'});}
  body.innerHTML=`<div class="settings-layout"><div style="width:200px;flex-shrink:0;background:var(--navy-mid);border-right:1px solid var(--border);padding:16px 0;"><div style="padding:14px 18px;font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--dark);margin-bottom:4px;">Settings</div>${tabs.map(t=>`<div class="settings-nav-item ${settingsTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('')}</div><div style="flex:1;padding:24px;overflow-y:auto;"><div id="stab-body">${renderSettingsTab(u)}</div></div></div>`;
  body.querySelectorAll('.settings-nav-item[data-tab]').forEach(el=>el.addEventListener('click',()=>{settingsTab=el.dataset.tab;body.querySelectorAll('.settings-nav-item').forEach(i=>i.classList.toggle('active',i.dataset.tab===settingsTab));document.getElementById('stab-body').innerHTML=renderSettingsTab(u);bindSettings(body);}));
  bindSettings(body);
}

tyle="margin-bottom:14px;">Used for password recovery.</div>${hasQ?`<div style="padding:10px 14px;background:var(--navy-light);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--dark);margin-bottom:14px;">${regUser.securityQ}</div>`:'<div class="alert-info" style="margin-bottom:14px;">No security question set yet.</div>'}<div class="form-group" style="margin-bottom:12px;"><label class="form-label">Security Question</label><select class="form-select" id="sq-new"><option value="">Select a question...</option>${qOpts.map(q=>`<option ${regUser.securityQ===q?'selected':''}>${q}</option>`).join('')}</select></div><div class="form-group" style="margin-bottom:12px;"><label class="form-label">Answer</label><input class="form-input" id="sq-ans-new" type="text" placeholder="Your answer"/></div><button class="btn btn-primary" id="save-sq">Save Security Question</button></div></div>`;
  }

function bindSettings(body){
  body.querySelector('#save-prof')?.addEventListener('click',async()=>{
    const first=body.querySelector('#pfirst')?.value||'';const last=body.querySelector('#plast')?.value||'';const email=body.querySelector('#pemail')?.value||'';const phone=body.querySelector('#pphone')?.value||'';
    if(!first){showToast('Name required','error');return;}
    const profileData = {
      action:'save_profile',
      name:[first,last].filter(Boolean).join(' '),
      email, phone,
      address:           body.querySelector('#paddress')?.value||'',
      birthday:          body.querySelector('#pbday')?.value||null,
      gender:            body.querySelector('#pgender')?.value||'',
      occupation:        body.querySelector('#pocc')?.value||'',
      nationality:       body.querySelector('#pnat')?.value||'',
      emergencyName:     body.querySelector('#pecn')?.value||'',
      emergencyPhone:    body.querySelector('#pecp')?.value||'',
      emergencyRelation: body.querySelector('#pecr')?.value||'',
    };
    try{
      const r=await api('settings',profileData);
      db.currentUser.name=r.name;db.currentUser.initials=r.initials;db.currentUser.email=email;
      await syncDB();
      renderSidebar();showToast('Profile saved!','success');
    }catch(e){showToast(e.message,'error');}
  });
  body.querySelector('#save-house')?.addEventListener('click',async()=>{
    const house=body.querySelector('#house-name')?.value||'';
    try{await api('settings',{action:'save_house',house});showToast('House info saved!','success');}
    catch(e){showToast(e.message,'error');}
  });
  const cpNew=body.querySelector('#cp-new');
  if(cpNew){
    const strengthWrap=body.querySelector('#cp-strength');const strengthLbl=body.querySelector('#cp-strength-lbl');const segs=body.querySelectorAll('.cps-seg');
    const sColors=['var(--red)','var(--amber)','var(--amber)','var(--teal)'];const sLabels=['Weak','Fair','Good','Strong'];
    function calcStr(p){let s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[A-Z]/.test(p)&&/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return Math.min(s,4);}
    cpNew.addEventListener('input',()=>{const v=cpNew.value;if(!v){if(strengthWrap)strengthWrap.style.display='none';return;}if(strengthWrap)strengthWrap.style.display='block';const str=calcStr(v);segs.forEach((seg,i)=>{seg.style.background=i<str?sColors[str-1]:'var(--navy-light)';});if(strengthLbl){strengthLbl.textContent=str>0?sLabels[str-1]:'';strengthLbl.style.color=sColors[str-1]||'var(--slate)';}});
    body.querySelector('#cp-toggle')?.addEventListener('click',()=>{cpNew.type=cpNew.type==='password'?'text':'password';});
  }
  body.querySelector('#save-pwd')?.addEventListener('click',async()=>{
    const curr=body.querySelector('#cp-current')?.value;const nw=body.querySelector('#cp-new')?.value;const conf=body.querySelector('#cp-confirm')?.value;
    if(!curr||!nw||!conf){showToast('Fill all password fields','error');return;}
    try{await api('settings',{action:'change_password',current:curr,new:nw,confirm:conf});showToast('Password updated!','success');body.querySelector('#cp-current').value='';body.querySelector('#cp-new').value='';body.querySelector('#cp-confirm').value='';if(body.querySelector('#cp-strength'))body.querySelector('#cp-strength').style.display='none';}
    catch(e){showToast(e.message,'error');}
  });
  body.querySelector('#save-sq')?.addEventListener('click',async()=>{
    const q=body.querySelector('#sq-new')?.value;const a=body.querySelector('#sq-ans-new')?.value.trim();
    if(!q){showToast('Select a question','error');return;}if(!a){showToast('Enter an answer','error');return;}
    try{await api('settings',{action:'save_security_question',question:q,answer:a});showToast('Security question saved!','success');}
    catch(e){showToast(e.message,'error');}
  });
  body.querySelectorAll('.toggle').forEach(t=>t.addEventListener('click',()=>{t.classList.toggle('on');t.classList.toggle('off');}));
}


// ══════════════════════════════════════════════════════════════
// MESSAGES — real-time-style chat between all roles
// ══════════════════════════════════════════════════════════════
var _msgPollTimer    = null;
var _activeMsgPartner = null;  // { id, name, role, initials, avColor }
var _msgContactSearch = '';

function pageMessages() {
  buildShell();
  setTopbar('Messages',
    `<button class="btn btn-primary" id="msg-new-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> New Message</button>`
  );
  document.getElementById('msg-new-btn').addEventListener('click', newMessageModal);
  drawMessagesPage();
}

async function drawMessagesPage() {
  const body = getBody();
  body.style.padding = '0';
  body.style.overflow = 'hidden';

  // Load conversations
  let convs = [];
  let contacts = [];
  try {
    const r = await api('messages', { action: 'conversations' });
    convs = r.conversations || [];
    const cr = await api('messages', { action: 'contacts' });
    contacts = cr.contacts || [];
  } catch(e) {
    showToast('Failed to load messages: ' + e.message, 'error');
  }

  // Role color helper
  const roleClass = r => r === 'Landlord' ? 'landlord' : r === 'System Admin' ? 'admin' : 'tenant';
  const roleLabel = r => r === 'System Admin' ? 'Admin' : r;
  const timeAgo   = iso => {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff/60000), h = Math.floor(m/60), d = Math.floor(h/24);
    if (d > 0) return d + 'd';
    if (h > 0) return h + 'h';
    if (m > 0) return m + 'm';
    return 'now';
  };

  // Contacts not yet in conversation
  const convPartnerIds = new Set(convs.map(c => c.partnerId));
  const freshContacts  = contacts.filter(c => !convPartnerIds.has(c.id));

  body.innerHTML = `
    <div class="msg-layout">

      <!-- ── LEFT: Contact / Conversation list ── -->
      <div class="msg-sidebar">
        <div class="msg-sidebar-header">
          <span class="msg-sidebar-title">Messages</span>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--slate);">${convs.length} conversation${convs.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="msg-search">
          <input id="msg-contact-search" placeholder="Search people..." value="${_msgContactSearch}"/>
        </div>
        <div class="msg-contact-list" id="msg-contact-list">
          ${convs.length === 0 && freshContacts.length === 0
            ? `<div style="padding:30px;text-align:center;color:var(--slate);">
                 <div style="display:flex;justify-content:center;margin-bottom:10px;opacity:.5;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                 <p style="font-size:13px;font-weight:600;color:var(--dark);">No messages yet</p>
                 <p class="text-xs" style="margin-top:4px;">Click "New Message" to start a conversation.</p>
               </div>`
            : ''}

          ${convs.map(c => `
            <div class="msg-contact ${_activeMsgPartner?.id === c.partnerId ? 'active' : ''}" data-pid="${c.partnerId}" data-pname="${c.partnerName}" data-prole="${c.partnerRole}" data-pini="${c.partnerInitials}" data-pav="${c.partnerAvColor}">
              <div class="avatar av-${c.partnerAvColor}">${c.partnerInitials}</div>
              <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <div class="msg-contact-name">${c.partnerName}</div>
                  <span class="msg-role-pill ${roleClass(c.partnerRole)}">${roleLabel(c.partnerRole)}</span>
                </div>
                <div class="msg-contact-preview">${c.isFromMe ? '' : ''}${c.lastMessage}</div>
              </div>
              <span class="msg-contact-time">${timeAgo(c.lastTime)}</span>
              ${c.unreadCount > 0 ? `<span class="msg-unread-badge">${c.unreadCount}</span>` : ''}
            </div>
          `).join('')}

          ${freshContacts.length > 0 ? `
            <div style="padding:8px 16px;font-family:var(--font-mono);font-size:9px;color:var(--slate-light);letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--border);margin-top:4px;">People you can message</div>
            ${freshContacts.map(c => `
              <div class="msg-contact ${_activeMsgPartner?.id === c.id ? 'active' : ''}" data-pid="${c.id}" data-pname="${c.name}" data-prole="${c.role}" data-pini="${c.initials}" data-pav="${c.avColor}">
                <div class="avatar av-${c.avColor}">${c.initials}</div>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <div class="msg-contact-name">${c.name}</div>
                    <span class="msg-role-pill ${roleClass(c.role)}">${roleLabel(c.role)}</span>
                  </div>
                  <div class="msg-contact-preview" style="font-style:italic;">No messages yet</div>
                </div>
              </div>
            `).join('')}
          ` : ''}
        </div>
      </div>

      <!-- ── RIGHT: Thread view ── -->
      <div class="msg-main" id="msg-main">
        ${_activeMsgPartner
          ? ''  /* thread loaded below */
          : `<div class="msg-no-thread">
               <div style="display:flex;justify-content:center;margin-bottom:8px;opacity:.5;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
               <div style="font-size:15px;font-weight:700;color:var(--dark);">Select a conversation</div>
               <div class="text-xs">Pick someone from the left or start a new message.</div>
             </div>`}
      </div>
    </div>
  `;

  // Wire contact clicks
  document.querySelectorAll('.msg-contact[data-pid]').forEach(el => {
    el.addEventListener('click', () => {
      _activeMsgPartner = {
        id:       el.dataset.pid,
        name:     el.dataset.pname,
        role:     el.dataset.prole,
        initials: el.dataset.pini,
        avColor:  el.dataset.pav,
      };
      document.querySelectorAll('.msg-contact').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      loadThread(_activeMsgPartner);
    });
  });

  // Search filter
  document.getElementById('msg-contact-search')?.addEventListener('input', e => {
    _msgContactSearch = e.target.value.toLowerCase();
    const q = _msgContactSearch;
    document.querySelectorAll('.msg-contact[data-pid]').forEach(el => {
      el.style.display = el.dataset.pname.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  if (_msgContactSearch) {
    document.querySelectorAll('.msg-contact[data-pid]').forEach(el => {
      el.style.display = el.dataset.pname.toLowerCase().includes(_msgContactSearch) ? '' : 'none';
    });
  }

  // If we already have an active partner, load their thread
  if (_activeMsgPartner) {
    loadThread(_activeMsgPartner);
    // Highlight the active contact
    const el = document.querySelector(`.msg-contact[data-pid="${_activeMsgPartner.id}"]`);
    el?.classList.add('active');
  }

  // Auto-poll: refresh thread every 8 seconds
  clearInterval(_msgPollTimer);
  _msgPollTimer = setInterval(() => {
    if (currentPage !== '/messages') { clearInterval(_msgPollTimer); return; }
    if (_activeMsgPartner) refreshThread(_activeMsgPartner.id);
  }, 8000);
}

async function loadThread(partner) {
  const main = document.getElementById('msg-main');
  if (!main) return;
  const roleClass = r => r === 'Landlord' ? 'landlord' : r === 'System Admin' ? 'admin' : 'tenant';
  const roleLabel = r => r === 'System Admin' ? 'Admin' : r;

  main.innerHTML = `<div style="padding:30px;text-align:center;color:var(--slate);">Loading...</div>`;

  let messages = [];
  try {
    const r = await api('messages', { action: 'thread', partnerId: partner.id });
    messages = r.messages || [];
  } catch(e) {
    main.innerHTML = `<div class="msg-empty"><p>Failed to load thread.</p></div>`;
    return;
  }

  const fmtTime = iso => new Date(iso).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
  const fmtDay  = iso => new Date(iso).toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });

  // Group by date
  let lastDate = null;

  main.innerHTML = `
    <!-- Thread header -->
    <div class="msg-main-header">
      <div class="avatar av-${partner.avColor}">${partner.initials}</div>
      <div>
        <div style="font-weight:700;font-size:14px;color:var(--dark);">${partner.name}</div>
        <span class="msg-role-pill ${roleClass(partner.role)}">${roleLabel(partner.role)}</span>
      </div>
    </div>

    <!-- Messages thread -->
    <div class="msg-thread" id="msg-thread">
      ${messages.length === 0
        ? `<div class="msg-empty">
             <div style="display:flex;justify-content:center;margin-bottom:8px;opacity:.5;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/><path d="M7 7.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/><path d="M7 15.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/></svg></div>
             <div style="font-size:14px;font-weight:600;color:var(--dark);">Start a conversation with ${partner.name}</div>
             <div class="text-xs">Your messages are private between you two.</div>
           </div>`
        : messages.map(m => {
            const day = fmtDay(m.createdAt);
            let divider = '';
            if (day !== lastDate) { divider = `<div class="msg-date-divider">── ${day} ──</div>`; lastDate = day; }
            return `${divider}
              <div class="msg-bubble-wrap ${m.isFromMe ? 'me' : ''}">
                ${!m.isFromMe ? `<div class="avatar av-${m.avColor}" style="width:28px;height:28px;font-size:9px;">${m.initials}</div>` : ''}
                <div>
                  <div class="msg-bubble ${m.isFromMe ? 'me' : 'them'}">${escapeHtml(m.body)}</div>
                  <div class="msg-bubble-time">${fmtTime(m.createdAt)}${m.isFromMe ? (m.isRead ? ' ✓✓' : ' ✓') : ''}</div>
                </div>
              </div>`;
          }).join('')}
    </div>

    <!-- Composer -->
    <div class="msg-composer">
      <textarea id="msg-input" placeholder="Type a message..." rows="1"></textarea>
      <button class="msg-send-btn" id="msg-send-btn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  `;

  // Scroll to bottom
  const thread = document.getElementById('msg-thread');
  if (thread) thread.scrollTop = thread.scrollHeight;

  // Auto-resize textarea
  const ta = document.getElementById('msg-input');
  if (ta) {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(partner); }
    });
    ta.focus();
  }

  document.getElementById('msg-send-btn')?.addEventListener('click', () => sendMessage(partner));
}

async function refreshThread(partnerId) {
  if (!_activeMsgPartner || _activeMsgPartner.id !== partnerId) return;
  try {
    const r = await api('messages', { action: 'thread', partnerId });
    const messages = r.messages || [];
    const thread = document.getElementById('msg-thread');
    if (!thread) return;

    const wasAtBottom = thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 20;
    const fmtTime = iso => new Date(iso).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
    const fmtDay  = iso => new Date(iso).toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });

    let lastDate = null;
    thread.innerHTML = messages.length === 0
      ? `<div class="msg-empty"><div style="display:flex;justify-content:center;margin-bottom:8px;opacity:.5;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/><path d="M7 7.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/><path d="M7 15.5c1-1 2-1.5 3-1.5s2 .5 3 1.5 2 1.5 3 1.5"/></svg></div><div style="font-size:14px;font-weight:600;color:var(--dark);">No messages yet</div></div>`
      : messages.map(m => {
          const day = fmtDay(m.createdAt);
          let divider = '';
          if (day !== lastDate) { divider = `<div class="msg-date-divider">── ${day} ──</div>`; lastDate = day; }
          return `${divider}
            <div class="msg-bubble-wrap ${m.isFromMe ? 'me' : ''}">
              ${!m.isFromMe ? `<div class="avatar av-${m.avColor}" style="width:28px;height:28px;font-size:9px;">${m.initials}</div>` : ''}
              <div>
                <div class="msg-bubble ${m.isFromMe ? 'me' : 'them'}">${escapeHtml(m.body)}</div>
                <div class="msg-bubble-time">${fmtTime(m.createdAt)}${m.isFromMe ? (m.isRead ? ' ✓✓' : ' ✓') : ''}</div>
              </div>
            </div>`;
        }).join('');

    if (wasAtBottom) thread.scrollTop = thread.scrollHeight;
    renderNotifBadge();
  } catch(_) {}
}

async function sendMessage(partner) {
  const ta  = document.getElementById('msg-input');
  const btn = document.getElementById('msg-send-btn');
  const body = ta?.value.trim();
  if (!body) return;
  ta.value = ''; ta.style.height = 'auto';
  btn.disabled = true;

  // Optimistic: append locally
  const thread = document.getElementById('msg-thread');
  if (thread) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-bubble-wrap me';
    wrap.innerHTML = `<div><div class="msg-bubble me">${escapeHtml(body)}</div><div class="msg-bubble-time">${new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})} ✓</div></div>`;
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  try {
    await api('messages', { action: 'send', toUserId: partner.id, body });
    btn.disabled = false;
    // Refresh to sync read receipts and new messages from partner
    setTimeout(() => refreshThread(partner.id), 500);
  } catch(e) {
    showToast(e.message, 'error');
    btn.disabled = false;
  }
}

function newMessageModal() {
  api('messages', { action: 'contacts' }).then(r => {
    const contacts = r.contacts || [];
    if (contacts.length === 0) { showToast('No other users to message', 'warning'); return; }
    const roleClass = r => r === 'Landlord' ? 'landlord' : r === 'System Admin' ? 'admin' : 'tenant';
    const roleLabel = r => r === 'System Admin' ? 'Admin' : r;

    openModal({
      title: 'New Message',
      body: `
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Send to</label>
          <div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;">
            ${contacts.map(c => `
              <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s;" onmouseenter="this.style.background='var(--navy-light)'" onmouseleave="this.style.background=''">
                <input type="radio" name="msg-to" value="${c.id}" style="accent-color:var(--teal);"/>
                <div class="avatar av-${c.avColor}" style="width:28px;height:28px;font-size:10px;">${c.initials}</div>
                <div>
                  <div style="font-weight:600;font-size:13px;color:var(--dark);">${c.name}</div>
                  <span class="msg-role-pill ${roleClass(c.role)}">${roleLabel(c.role)}</span>
                </div>
              </label>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Message *</label>
          <textarea class="form-textarea" id="new-msg-body" placeholder="Write your message..." style="min-height:90px;"></textarea>
        </div>
      `,
      confirmText: 'Send Message',
      onConfirm: async ov => {
        const toId = ov.querySelector('input[name="msg-to"]:checked')?.value;
        const body = ov.querySelector('#new-msg-body')?.value.trim();
        if (!toId)  { showToast('Select a recipient', 'error'); return; }
        if (!body)  { showToast('Write a message', 'error'); return; }
        const btn = ov.querySelector('#mok');
        btn.disabled = true; btn.textContent = 'Sending...';
        try {
          await api('messages', { action: 'send', toUserId: toId, body });
          const contact = contacts.find(c => c.id === toId);
          _activeMsgPartner = contact ? { id: contact.id, name: contact.name, role: contact.role, initials: contact.initials, avColor: contact.avColor } : null;
          ov.remove();
          showToast('Message sent!', 'success');
          drawMessagesPage();
        } catch(e) {
          showToast(e.message, 'error');
          btn.disabled = false; btn.textContent = 'Send Message';
        }
      }
    });
  }).catch(e => showToast(e.message, 'error'));
}

// Escape HTML helper
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

register('/audit-logs',      authGuard(pageAuditLogs));
register('/subscriptions',   authGuard(pageSubscriptions));

register('/my-invoices',     authGuard(pageMyInvoices));

  document.getElementById('loading-overlay').style.display = 'none';
  navigate('/login');
